<style>
/* ===== デザイントークン ===== */
:root{
  --bg:#03070a; --bg2:#071018; --panel:rgba(9,18,26,.92); --panel2:rgba(14,28,40,.9);
  --line:rgba(120,215,255,.16); --line2:rgba(120,215,255,.32);
  --cyan:#56d9ff; --cyan-d:#1c90b8; --green:#52ffaa; --amber:#ffc54d; --red:#ff5a6e; --violet:#c48bff;
  --nh3:#c8ef4c; --no2:#c48bff; --no3:#4fb6ff; --algae:#5fe07e;
  --text:#d7eef8; --dim:rgba(215,238,248,.58); --faint:rgba(215,238,248,.32);
  --f-head:'Orbitron','Share Tech Mono',system-ui,sans-serif;
  --f-mono:'Share Tech Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --f-jp:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#010305;overflow:hidden;overscroll-behavior:none}
body{color:var(--text);font-family:var(--f-jp);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:960px;height:540px;flex:none;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#0a1822 0%,var(--bg) 60%);transform-origin:center center}
#app.busy .scr{pointer-events:none}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:900;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.05) 2px 3px);mix-blend-mode:multiply}

/* ===== 画面切り替え ===== */
.scr{position:absolute;inset:0;display:none;opacity:0;transition:opacity .35s ease}
.scr.on{display:block}
.scr.vis{opacity:1}

/* ===== 共通部品 ===== */
.mono{font-family:var(--f-mono);letter-spacing:.06em}
.head{font-family:var(--f-head);letter-spacing:.12em}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 14px;border:1px solid var(--line2);border-radius:3px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--text);background:rgba(86,217,255,.05);transition:background .15s,border-color .15s,color .15s,transform .08s}
.btn:hover{background:rgba(86,217,255,.13);border-color:var(--cyan)}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:var(--green);color:var(--green);background:rgba(82,255,170,.08);box-shadow:0 0 14px rgba(82,255,170,.12)}
.btn.primary:hover{background:rgba(82,255,170,.18)}
.btn.danger{border-color:rgba(255,90,110,.6);color:var(--red)}
.btn.danger:hover{background:rgba(255,90,110,.12)}
.btn.ghost{border-color:transparent;background:none;color:var(--dim)}
.btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.05)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.sm{height:24px;padding:0 9px;font-size:11px}
.btn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(86,217,255,.16)}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.icon{width:26px;height:26px;object-fit:contain;flex:none}
.icon.sm{width:18px;height:18px}
.topbar{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(86,217,255,.07),rgba(86,217,255,0))}
.topbar .tt{font-family:var(--f-head);font-size:12.5px;letter-spacing:.14em;color:var(--cyan)}
.topbar .sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--line)}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.scroll::-webkit-scrollbar{width:5px}.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.star{display:inline-block;width:14px;height:14px;background:var(--faint);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.on{background:var(--amber);filter:drop-shadow(0 0 4px rgba(255,197,77,.8))}
.badge-os{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:2px;font-family:var(--f-head);font-size:8.5px;font-weight:700;letter-spacing:.12em;color:#03070a;background:linear-gradient(90deg,var(--amber),#fff1b8);box-shadow:0 0 8px rgba(255,197,77,.5)}

/* ===== BOOT / OPENING ===== */
#scr-boot{cursor:pointer}
#scr-boot .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#scr-boot .t1{font-family:var(--f-head);font-size:13px;letter-spacing:.5em;color:var(--cyan);opacity:.8}
#scr-boot .t2{font-family:var(--f-mono);font-size:13px;letter-spacing:.3em;color:var(--text);animation:blink 1.6s infinite}
#scr-boot .t3{font-size:11px;color:var(--faint)}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
#scr-opening{background:#000}
#op-lines{position:absolute;left:120px;right:120px;top:170px;display:flex;flex-direction:column;gap:14px}
#op-lines .ln{font-size:17px;line-height:1.7;letter-spacing:.06em;opacity:0;transform:translateY(6px);transition:opacity 1.2s,transform 1.2s}
#op-lines .ln.show{opacity:1;transform:none}
#op-lines .ln.sys{font-family:var(--f-mono);font-size:12px;color:var(--cyan);letter-spacing:.2em}
#op-skip{position:absolute;right:18px;bottom:16px}

/* ===== TITLE ===== */
#title-tank{position:absolute;inset:0;width:960px;height:540px}
#title-veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,9,.94) 0%,rgba(2,6,9,.72) 36%,rgba(2,6,9,.05) 70%),linear-gradient(0deg,rgba(2,6,9,.7),transparent 30%)}
#title-ui{position:absolute;left:48px;top:44px;width:390px}
#title-ui .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.42em;color:var(--cyan)}
#title-ui h1{font-family:var(--f-head);font-weight:900;font-size:52px;line-height:1;letter-spacing:.06em;margin:4px 0 4px;background:linear-gradient(180deg,#eafaff 0%,var(--cyan) 70%,#2aa9d8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(86,217,255,.35))}
#title-ui .sub{font-family:var(--f-head);font-size:15px;letter-spacing:.45em;color:var(--text)}
#title-ui .jp{font-size:12px;letter-spacing:.4em;color:var(--dim);margin-top:4px}
#title-ui .tag{white-space:pre-line;margin:14px 0 16px;font-size:12px;line-height:1.75;color:var(--dim);border-left:2px solid var(--cyan-d);padding-left:12px}
#title-menu{display:flex;flex-direction:column;gap:6px;width:300px}
.mbtn{display:grid;grid-template-columns:18px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:3px;background:rgba(5,14,20,.7);text-align:left;transition:all .15s}
.mbtn:hover{border-color:var(--cyan);background:rgba(86,217,255,.1);transform:translateX(3px)}
.mbtn .mi{grid-row:1 / span 2;font-family:var(--f-head);font-size:13px;color:var(--cyan);text-align:center}
.mbtn .mt{font-size:13.5px;font-weight:700;letter-spacing:.06em;line-height:1.15}
.mbtn .ms{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--faint);line-height:1.2}
.mbtn.primary{border-color:rgba(82,255,170,.55);background:rgba(82,255,170,.07)}
.mbtn.primary .mi,.mbtn.primary .mt{color:var(--green)}
.mbtn.locked{opacity:.45}
#title-foot{position:absolute;left:48px;bottom:12px;right:20px;display:flex;align-items:center;gap:14px;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.1em}
#title-foot .sp{flex:1}

/* ===== STAGE SELECT ===== */
#sel-body{position:absolute;left:12px;right:12px;top:52px;bottom:12px;display:flex;gap:12px}
#sel-list{width:520px;display:flex;flex-direction:column;gap:10px}
.ch-tabs{display:flex;gap:6px}
.ch-tab{flex:1;height:44px;border:1px solid var(--line);border-radius:3px;background:rgba(5,14,20,.6);text-align:left;padding:0 12px;display:flex;flex-direction:column;justify-content:center}
.ch-tab .n{font-family:var(--f-head);font-size:9.5px;letter-spacing:.2em;color:var(--dim)}
.ch-tab .t{font-size:12.5px;font-weight:700}
.ch-tab.on{border-color:var(--cyan);background:rgba(86,217,255,.1)}
.ch-tab.on .n{color:var(--cyan)}
.ch-tab.locked{opacity:.4;pointer-events:none}
#sel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;flex:1;align-content:start}
.st-card{position:relative;height:96px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(160deg,rgba(14,32,44,.85),rgba(6,14,20,.9));padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:border-color .15s,transform .12s}
.st-card:hover{border-color:var(--line2);transform:translateY(-1px)}
.st-card.on{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(86,217,255,.3) inset,0 0 18px rgba(86,217,255,.12)}
.st-card .id{font-family:var(--f-head);font-size:10px;letter-spacing:.2em;color:var(--cyan)}
.st-card .nm{font-size:14.5px;font-weight:700;letter-spacing:.04em}
.st-card .meta{display:flex;align-items:center;gap:8px;margin-top:auto}
.st-card .meta .d{font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
.st-card .stars{display:flex;gap:2px;margin-left:auto}
.st-card.locked{opacity:.38;pointer-events:none}
.st-card.locked .nm{color:var(--dim)}
.st-card .new{position:absolute;right:10px;top:9px;display:flex;gap:2px}
#sel-brief{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#sel-brief .bid{font-family:var(--f-head);font-size:11px;letter-spacing:.25em;color:var(--cyan)}
#sel-brief h2{font-size:22px;letter-spacing:.04em;line-height:1.2}
#sel-brief .story{font-size:12.5px;line-height:1.85;color:var(--dim);min-height:68px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;align-items:center}
.kv .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint)}
.goal-list{display:flex;flex-direction:column;gap:4px}
.goal-row{display:flex;align-items:center;gap:8px;font-size:12px}
#sel-brief .go{margin-top:auto;display:flex;gap:8px;align-items:center}
.inv-strip{display:flex;flex-wrap:wrap;gap:4px}
.inv-pill{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 6px 0 2px;border:1px solid var(--line);border-radius:3px;font-family:var(--f-mono);font-size:11px;color:var(--dim);background:rgba(0,0,0,.25)}
.inv-pill.new{border-color:rgba(255,197,77,.6);color:var(--amber)}

/* ===== SETUP / OBSERVE 共通レイアウト ===== */
.tank-box{position:absolute;left:12px;top:50px;width:592px;height:432px;border:1px solid var(--line2);border-radius:3px;background:#02080c;box-shadow:0 0 30px rgba(40,160,220,.1),inset 0 0 0 1px rgba(0,0,0,.6);overflow:hidden}
.tank-box canvas{position:absolute;left:0;top:0;width:592px;height:432px;touch-action:none}
.under-tank{position:absolute;left:12px;top:488px;width:592px;height:42px;display:flex;align-items:center;gap:10px}
.side{position:absolute;left:614px;top:50px;right:12px;bottom:10px;display:flex;flex-direction:column;gap:7px}
.goalbar{display:flex;align-items:center;gap:8px;min-width:0}
.goalbar .gt{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#coach{flex:1;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border:1px solid rgba(86,217,255,.3);border-radius:3px;background:rgba(86,217,255,.06);font-size:12px;line-height:1.45;color:var(--text)}
#coach .ci{font-family:var(--f-head);font-size:10px;letter-spacing:.2em;color:var(--cyan);flex:none}
#coach.warn{border-color:rgba(255,197,77,.45);background:rgba(255,197,77,.07)}
.tabbar{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;height:30px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--dim);border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab .cnt{font-size:10px;color:var(--faint)}
#inv-list{height:150px;padding:6px;display:flex;flex-direction:column;gap:5px}
.item{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:rgba(86,217,255,.03);cursor:pointer;transition:background .12s,border-color .12s}
.item:hover{background:rgba(86,217,255,.08);border-color:var(--line2)}
.item.on{border-color:var(--cyan);background:rgba(86,217,255,.14);box-shadow:0 0 10px rgba(86,217,255,.15)}
.item.empty{opacity:.4}
.item .nm{font-size:12.5px;font-weight:700;line-height:1.2}
.item .ds{font-size:10.5px;color:var(--dim);line-height:1.35;margin-top:1px}
.item .info{flex:1;min-width:0}
.item .num{font-family:var(--f-mono);font-size:13px;color:var(--green);min-width:34px;text-align:right}
.stepper{display:flex;align-items:center;gap:3px}
.stepper button{width:30px;height:28px;border:1px solid var(--line2);border-radius:3px;font-family:var(--f-mono);font-size:14px;line-height:1;color:var(--cyan)}
.stepper button:hover{background:rgba(86,217,255,.15)}
.stepper button[disabled]{opacity:.25;pointer-events:none}
.stepper .v{font-family:var(--f-mono);font-size:13px;min-width:34px;text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.tg{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;padding:1px 4px;border-radius:2px;background:rgba(255,255,255,.06);color:var(--dim)}
.tg.w{color:var(--amber);background:rgba(255,197,77,.1)}
.tg.g{color:var(--green);background:rgba(82,255,170,.08)}
.tg.r{color:var(--red);background:rgba(255,90,110,.1)}
.diag{padding:7px 10px;display:flex;flex-direction:column;gap:4px}
.drow{display:grid;grid-template-columns:92px 1fr 56px;align-items:center;gap:8px;font-size:11px;line-height:1.3}
.drow .dl{color:var(--dim);font-size:11px}
.drow .dv{font-family:var(--f-mono);font-size:11px;text-align:right}
.bar{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--cyan);transition:width .25s,background .25s}
.risk{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:2px;text-align:center}
.risk.r0{color:var(--green);background:rgba(82,255,170,.1)}
.risk.r1{color:var(--amber);background:rgba(255,197,77,.12)}
.risk.r2{color:#ff9b5a;background:rgba(255,155,90,.14)}
.risk.r3{color:var(--red);background:rgba(255,90,110,.16)}
.plan{padding:6px 10px 4px}
.timeline{position:relative;height:26px;margin-top:4px}
.timeline .rail{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line2)}
.timeline .ev{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:1;z-index:1}
.timeline .ev .dd{font-family:var(--f-mono);font-size:9px;color:var(--dim);margin-top:2px}
.timeline .end{position:absolute;right:0;top:16px;font-family:var(--f-mono);font-size:9.5px;color:var(--dim)}
.timeline .cur{position:absolute;top:6px;width:2px;height:14px;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
#seal-btn{flex:none;height:46px;margin-top:auto;font-family:var(--f-head);font-size:14px;letter-spacing:.18em;font-weight:700;border:1px solid var(--green);color:var(--green);background:linear-gradient(135deg,rgba(82,255,170,.16),rgba(86,217,255,.08));border-radius:3px;box-shadow:0 0 18px rgba(82,255,170,.15);transition:all .15s}
#seal-btn:hover{background:rgba(82,255,170,.24);box-shadow:0 0 26px rgba(82,255,170,.3)}
#seal-btn small{display:block;font-family:var(--f-jp);font-size:10.5px;letter-spacing:.1em;font-weight:500;color:var(--dim);margin-top:2px}
#seal-btn.blocked{border-color:var(--line2);color:var(--dim);box-shadow:none;background:rgba(255,255,255,.03)}
.equip-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:3px}
.equip-row .nm{font-size:12px;font-weight:700;flex:1}
.seg{display:flex;gap:3px}
.seg button{height:26px;min-width:32px;padding:0 6px;border:1px solid var(--line2);border-radius:3px;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.seg button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(86,217,255,.16)}

/* ===== OBSERVE ===== */
#obs-day{display:flex;align-items:baseline;gap:8px}
#obs-day .n{font-family:var(--f-head);font-size:30px;font-weight:700;color:var(--cyan);text-shadow:0 0 14px rgba(86,217,255,.5);letter-spacing:.06em}
#obs-day .of{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.meter{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:11.5px}
.meter .ml{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em}
.meter .mv{font-family:var(--f-mono);font-size:12px;text-align:right}
.mbar{position:relative;height:12px;border-radius:2px;background:rgba(255,255,255,.06);overflow:visible}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.mbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red);box-shadow:0 0 5px var(--red)}
#roster{display:flex;flex-wrap:wrap;gap:3px;max-height:78px;overflow-y:auto;scrollbar-width:thin}
#roster.dense .rc{width:27px;height:24px}
#roster.dense .rc img{width:21px;height:16px}
.rc{position:relative;width:34px;height:30px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.rc img{width:26px;height:20px;object-fit:contain}
.rc .hp{position:absolute;left:2px;right:2px;bottom:2px;height:2px;background:rgba(255,255,255,.1)}
.rc .hp i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.rc.dead{opacity:.35;border-color:rgba(255,90,110,.4)}
.rc.dead img{filter:grayscale(1)}
.rc.dead::after{content:'✕';position:absolute;font-size:16px;color:var(--red);font-weight:700}
#obs-log{flex:1;min-height:0;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;line-height:1.5;overflow:hidden}
#obs-log .l{color:var(--dim);animation:logIn .4s ease}
#obs-log .l:first-child{color:var(--text)}
#obs-log .l .d{font-family:var(--f-mono);font-size:10px;color:var(--cyan);margin-right:6px}
#obs-log .l.bad .d{color:var(--red)}
#obs-log .l.good .d{color:var(--green)}
@keyframes logIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#obs-banner{position:absolute;left:12px;top:220px;width:592px;padding:10px 16px;text-align:center;font-family:var(--f-head);font-size:13px;letter-spacing:.14em;background:rgba(3,8,12,.86);border-top:1px solid var(--amber);border-bottom:1px solid var(--amber);color:var(--amber);opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
#obs-banner.show{opacity:1}
#obs-banner small{display:block;font-family:var(--f-jp);font-size:12px;letter-spacing:.04em;color:var(--text);margin-top:3px}
#obs-stamp{position:absolute;left:12px;top:50px;width:592px;height:432px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6}
#obs-stamp .s{font-family:var(--f-head);font-weight:900;font-size:40px;letter-spacing:.12em;padding:10px 26px;border:3px solid currentColor;transform:rotate(-6deg) scale(1.6);opacity:0;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s;background:rgba(3,8,12,.6)}
#obs-stamp.show .s{transform:rotate(-6deg) scale(1);opacity:1}

/* ===== RESULT ===== */
#res-body{position:absolute;left:12px;right:12px;top:50px;bottom:12px;display:flex;gap:12px}
#res-left{width:560px;display:flex;flex-direction:column;gap:10px}
#res-chart-box{position:relative;height:262px;padding:8px}
#res-chart{width:542px;height:226px}
#res-legend{display:flex;gap:12px;font-family:var(--f-mono);font-size:10px;color:var(--dim);padding:0 4px}
#res-legend span::before{content:'';display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;background:var(--c)}
#res-autopsy{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:12px;line-height:1.6}
.ap{display:flex;gap:8px}
.ap .apb{flex:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;padding:1px 5px;height:17px;border-radius:2px;margin-top:2px}
.ap .apb.bad{color:var(--red);background:rgba(255,90,110,.12)}
.ap .apb.good{color:var(--green);background:rgba(82,255,170,.1)}
.ap .apb.tip{color:var(--cyan);background:rgba(86,217,255,.1)}
.ap .apb.warn{color:var(--amber);background:rgba(255,197,77,.1)}
#res-right{flex:1;display:flex;flex-direction:column;gap:10px}
#res-verdict{padding:14px 16px;position:relative;overflow:hidden}
#res-verdict .code{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim)}
#res-verdict h2{font-family:var(--f-head);font-weight:900;font-size:30px;letter-spacing:.08em;margin:4px 0 2px}
#res-verdict .sub{font-size:12.5px;color:var(--dim)}
#res-verdict.clear h2{color:var(--green);text-shadow:0 0 20px rgba(82,255,170,.4)}
#res-verdict.fail h2{color:var(--red);text-shadow:0 0 20px rgba(255,90,110,.35)}
#res-stars{padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.sr{display:flex;align-items:center;gap:10px;font-size:12.5px;opacity:.5;transition:opacity .3s}
.sr .star{width:18px;height:18px;transform:scale(.6);transition:transform .35s cubic-bezier(.2,1.8,.4,1)}
.sr.on{opacity:1}
.sr.on .star{transform:scale(1)}
.sr .why{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
#res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:rgba(0,0,0,.2)}
.stat .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint)}
.stat .v{font-family:var(--f-head);font-size:16px;margin-top:2px}
#res-btns{margin-top:auto;display:flex;flex-direction:column;gap:7px}
#res-btns .btn{height:38px;font-size:13px}

/* ===== CODEX / RECORDS / SETTINGS ===== */
.two-col{position:absolute;left:12px;right:12px;top:52px;bottom:12px;display:flex;gap:12px}
#cx-list{width:300px;padding:8px;display:flex;flex-direction:column;gap:4px}
.cx-cat{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--faint);margin:6px 2px 2px}
.cx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cx-it{height:50px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.cx-it img{width:40px;height:34px;object-fit:contain}
.cx-it.on{border-color:var(--cyan);background:rgba(86,217,255,.12)}
.cx-it.locked img{filter:brightness(0) opacity(.35)}
#cx-detail{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
#cx-detail .hero{display:flex;gap:16px;align-items:center}
#cx-detail .hero img{width:150px;height:110px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
#cx-detail h3{font-size:20px}
#cx-detail .code{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;color:var(--cyan)}
#cx-detail .lore{font-size:12.5px;line-height:1.9;color:var(--dim);white-space:pre-line}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.sg{display:grid;grid-template-columns:86px 1fr 40px;gap:6px;align-items:center;font-size:11px}
.sg .k{color:var(--dim)}
.sg .v{font-family:var(--f-mono);text-align:right}
.ach{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:rgba(0,0,0,.2)}
.ach .ai{width:30px;height:30px;flex:none}
.ach .an{font-size:12.5px;font-weight:700}
.ach .ad{font-size:11px;color:var(--dim)}
.ach.locked{opacity:.42}
.ach.locked .ai{filter:grayscale(1) brightness(.6)}
.setrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.setrow .sl{flex:1}
.setrow .sl b{display:block;font-size:13px}
.setrow .sl span{font-size:11px;color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:180px;height:4px;border-radius:2px;background:var(--line2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--cyan);cursor:pointer}

/* ===== オーバーレイ ===== */
#modal{position:absolute;inset:0;z-index:700;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#modal.on{display:flex}
#modal .box.wide{width:720px}
.cyc{display:flex;align-items:center;gap:6px;margin:4px 0 12px;flex-wrap:nowrap}
.cyc .n{padding:6px 8px;border:1px solid var(--line2);border-radius:3px;font-size:11.5px;text-align:center;line-height:1.35;background:rgba(0,0,0,.25);white-space:nowrap}
.cyc .n b{display:block;font-family:var(--f-mono);font-size:12.5px}
.cyc .ar{font-family:var(--f-mono);font-size:10px;color:var(--dim);text-align:center;line-height:1.3}
.howgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:11.5px;line-height:1.7;color:var(--dim);white-space:normal}
.howgrid b{color:var(--text)}
#modal .box{width:440px;padding:20px 22px;background:var(--panel);border:1px solid var(--cyan);border-radius:4px;box-shadow:0 0 40px rgba(86,217,255,.2)}
#modal .mt{font-family:var(--f-head);font-size:14px;letter-spacing:.16em;color:var(--cyan);margin-bottom:10px}
#modal .mb{font-size:12.5px;line-height:1.8;color:var(--text);white-space:pre-line;margin-bottom:16px}
#modal .mbtns{display:flex;justify-content:flex-end;gap:8px}
#toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%) translateY(6px);z-index:800;padding:8px 16px;border-radius:3px;border:1px solid var(--red);background:rgba(20,6,8,.94);color:#ffc4cc;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:600px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-color:var(--green);background:rgba(4,18,12,.94);color:#bfffe0}
#tip{position:absolute;z-index:750;max-width:250px;padding:7px 10px;border:1px solid var(--line2);border-radius:3px;background:rgba(4,10,14,.96);font-size:11.5px;line-height:1.55;pointer-events:none;opacity:0;transition:opacity .12s}
#tip.show{opacity:1}
#tip b{color:var(--cyan)}
#fade{position:absolute;inset:0;z-index:850;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#fade.on{opacity:1}
#rotate{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#020507;color:var(--text);font-family:var(--f-jp);font-size:14px;text-align:center;padding:30px}
#rotate .ph{width:44px;height:72px;border:2px solid var(--cyan);border-radius:8px;animation:rot 2.2s infinite ease-in-out}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){.scr{transition:none}}
</style>

  <!-- BOOT: 最初の操作で音声を解禁する -->

<script>
"use strict";
// ===== SIM CORE BEGIN =====
// 純粋なシミュレーション層。DOM・音・保存に一切触れない(テストハーネスからも同じコードを実行するため)。
// 単位: 物質量は「mass」、毒性判定は濃度 c = mass * SIMCFG.VREF / 水量V。表示は濃度×10の整数。
const SIMCFG = {
  VREF: 60,              // 基準水量(セル数)。これより大きい水槽ほど同じ排泄でも薄まる
  HP_REGEN: 2,           // 無害な日のHP回復量/日
  DMG_NH3: 1.1,          // 耐性超過1あたりのダメージ(アンモニア)
  DMG_NO2: 1.0,          // 耐性超過1あたりのダメージ(亜硝酸)
  DMG_NO3_TH: 70,        // 硝酸塩がこの濃度を超えると慢性ダメージ
  DMG_NO3: 0.08,
  ALGAE_O2_TH: 70,       // コケがこの値を超えると夜間酸欠ダメージ
  ALGAE_O2_DMG: 0.25,
  BAC_GROWTH: 0.18,      // バクテリアのロジスティック成長率
  BAC_COLONIZE: 0.008,   // 住処(容量K)からの定着流入率/日
  BAC_STARVE: 0.97,      // 餌がない日の減衰
  BAC_EFF: 0.5,         // 個体数1あたりの処理量/日
  DECAY_DAYS: 3,         // 死骸がアンモニアに変わるまでの日数
  SCAVENGE: 0.5,         // 掃除屋がいる場合の死骸アンモニア倍率
  ALGAE_K: 0.12,         // コケ成長係数
  ALGAE_NO3_TH: 10,      // コケが育ち始める硝酸塩濃度
  ALGAE_COMPETE: 0.05,   // 水草量1あたりのコケ抑制
  DEPTH_ATT: 0.965,      // 1段深くなるごとの光の減衰
  LAMP: [0, 0.55, 0.8, 1.0],
  DARK_MELT_DAYS: 12,    // 有茎草が光不足に耐えられる日数
  BOTTLE_SEED: 3.0,      // バクテリア剤1本ぶんの初期バクテリア
};

// 生体マスタ: load=生体負荷, waste=排泄/日, tolA/tolN=耐性濃度, body=死骸の量, clean=コケ掃除, scav=死骸処理
const SPECIES = {
  fish_s:        { load:1, waste:0.55, tolA:6, tolN:7, body:3,  clean:0,   scav:false, zone:'mid',    size:0.85, value:10, kind:'fish' },
  guppy:         { load:1, waste:0.65, tolA:9, tolN:10, body:3,  clean:0,   scav:false, zone:'top',    size:0.9,  value:10, kind:'fish' },
  fish_m:        { load:2, waste:1.25, tolA:9, tolN:10, body:7,  clean:0,   scav:false, zone:'mid',    size:1.15, value:25, kind:'fish' },
  fish_l:        { load:3, waste:1.7,  tolA:7, tolN:8, body:12, clean:0,   scav:false, zone:'mid',    size:1.55, value:45, kind:'fish' },
  discus:        { load:4, waste:2.0,  tolA:4.5, tolN:5.5, body:16, clean:0,   scav:false, zone:'mid',    size:1.6,  value:80, kind:'fish' },
  arowana:       { load:5, waste:3.4,  tolA:11, tolN:12, body:26, clean:0,   scav:false, zone:'top',    size:2.5,  value:120, kind:'fish' },
  corydoras:     { load:1, waste:0.5,  tolA:9, tolN:9, body:3,  clean:0.1, scav:true,  zone:'bottom', size:0.9,  value:15, kind:'fish' },
  clown_loach:   { load:2, waste:1.1,  tolA:9, tolN:9, body:7,  clean:0.15, scav:true,  zone:'bottom', size:1.25, value:30, kind:'fish' },
  sailfin_pleco: { load:2, waste:1.6,  tolA:12, tolN:12, body:10, clean:1.2, scav:false, zone:'bottom', size:1.5,  value:35, kind:'fish' },
  otos:          { load:1, waste:0.25, tolA:6, tolN:7, body:2,  clean:0.6, scav:false, zone:'glass',  size:0.8,  value:10, kind:'cleaner' },
  shrimp:        { load:0, waste:0.08, tolA:7, tolN:3.5, body:1,  clean:0.35, scav:true,  zone:'bottom', size:0.8,  value:5,  kind:'cleaner' },
};

// 水草マスタ: w,h=占有セル, kind=stem(有茎・寿命あり)/shade(陰性・永続)/float(浮草)/epi(活着・砂利OK)
// grow=成長率, absorb=吸収係数, nh=アンモニア直接吸収の比率, life=寿命(日), shade=真下の光の透過率, need=成長に必要な光
const PLANTS = {
  plant_stem:        { w:1, h:1, kind:'stem',  grow:0.11, bmax:3.2, absorb:0.37, nh:0.35, life:55, shade:0.8,  need:0.45, value:6 },
  plant_ludwigia:    { w:1, h:1, kind:'stem',  grow:0.10, bmax:3.0, absorb:0.42, nh:0.30, life:60, shade:0.75, need:0.5,  value:8 },
  plant_wide:        { w:2, h:1, kind:'stem',  grow:0.07, bmax:3.6, absorb:0.35, nh:0.25, life:80, shade:0.8,  need:0.4,  value:8 },
  plant_tall:        { w:1, h:2, kind:'stem',  grow:0.06, bmax:3.8, absorb:0.34, nh:0.25, life:90, shade:0.7,  need:0.35, value:9 },
  plant_anubias:     { w:1, h:1, kind:'shade', grow:0.035,bmax:2.2, absorb:0.23, nh:0.20, life:-1, shade:0.7,  need:0.0,  value:5 },
  plant_willow_moss: { w:1, h:1, kind:'epi',   grow:0.04, bmax:2.0, absorb:0.19, nh:0.20, life:-1, shade:0.9,  need:0.0,  value:5 },
  plant_frogbit:     { w:1, h:1, kind:'float', grow:0.12, bmax:3.0, absorb:0.30, nh:0.30, life:70, shade:0.3,  need:0.2,  value:4 },
};

// 底床: surf=バクテリアの住処, feed=根への栄養, leak=立ち上げ初期のアンモニア溶出(日数,量)
const SUBSTRATES = {
  gravel:        { surf:5.0, feed:0.0,  leak:0,   leakDays:0 },
  soil:          { surf:2.2, feed:0.25, leak:0,   leakDays:0 },
  amazonia_soil: { surf:2.2, feed:0.55, leak:0.12, leakDays:14 },
};

const FILTERS = {
  none:     { K:0,  aer:0 },
  sponge:   { K:22, aer:1 },
  hangon:   { K:42, aer:1 },
  canister: { K:75, aer:1 },
};

// 予告イベント: 実験計画書に載る。運ではなく設計で備えるためのもの
const EVENT_DEFS = {
  heat:      { icon:'🌡', mul:{ waste:1.45, bac:0.85 } },
  power:     { icon:'⚡', mul:{ filter:0 } },
  quake:     { icon:'💥', burst:{ perSoil:0.35, perGravel:0.08 } },
  overfeed:  { icon:'🍤', burst:{ flat:6 } },
  lightfail: { icon:'🌑', mul:{ light:0 } },
  cold:      { icon:'❄',  mul:{ bacGrow:0.35 } },
  bloom:     { icon:'🟢', burst:{ algae:14 } },
};

const SIM = (() => {
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // レイアウトの読み取り: cells[r][c] = null | {t:'sub',id} | {t:'plant',id,ox,oy}
  function listPlants(layout) {
    const out = [];
    for (let r = 0; r < layout.H; r++) for (let c = 0; c < layout.W; c++) {
      const cell = layout.cells[r][c];
      if (cell && cell.t === 'plant' && cell.ox === c && cell.oy === r) out.push({ id: cell.id, c, r });
    }
    return out;
  }
  function countSub(layout) {
    const n = { gravel:0, soil:0, amazonia_soil:0, total:0 };
    for (let r = 0; r < layout.H; r++) for (let c = 0; c < layout.W; c++) {
      const cell = layout.cells[r][c];
      if (cell && cell.t === 'sub') { n[cell.id]++; n.total++; }
    }
    return n;
  }

  // 光: 各列を上から下へ。植物は自分より下を shade 倍に、底床は以降を遮断
  function computeLight(layout, lampLv) {
    const I0 = SIMCFG.LAMP[lampLv] || 0;
    const L = [];
    for (let r = 0; r < layout.H; r++) L.push(new Array(layout.W).fill(0));
    for (let c = 0; c < layout.W; c++) {
      let I = I0;
      for (let r = 0; r < layout.H; r++) {
        const cell = layout.cells[r][c];
        if (cell && cell.t === 'sub') { I = 0; L[r][c] = 0; continue; }
        L[r][c] = I * Math.pow(SIMCFG.DEPTH_ATT, r);
        if (cell && cell.t === 'plant') {
          // 多セル植物は最下段を抜けたところで減衰させる(同じ株で二重に減衰させない)
          const p = PLANTS[cell.id];
          if (r === cell.oy + p.h - 1) I *= p.shade;
        }
      }
    }
    return L;
  }

  function plantLight(L, pl) {
    const p = PLANTS[pl.id];
    let s = 0;
    for (let dc = 0; dc < p.w; dc++) s += L[pl.r][pl.c + dc];
    return s / p.w;
  }

  function rootFeed(layout, pl) {
    const p = PLANTS[pl.id];
    if (p.kind === 'float') return 0;
    const below = pl.r + p.h;
    if (below >= layout.H) return 0;
    let f = 0;
    for (let dc = 0; dc < p.w; dc++) {
      const cell = layout.cells[below][pl.c + dc];
      if (cell && cell.t === 'sub') f += SUBSTRATES[cell.id].feed;
    }
    return f / p.w;
  }

  // 設計診断(密閉前の読み取り用)。予測ではなく「つり合い」の目安だけを出す
  function analyze(layout, setup) {
    const sub = countSub(layout);
    const V = Math.max(1, layout.W * layout.H - sub.total);
    let waste = 0, load = 0, clean = 0, fish = 0;
    for (const cr of setup.creatures) {
      const s = SPECIES[cr.id]; waste += s.waste; load += s.load; clean += s.clean;
      if (s.kind === 'fish') fish++;
    }
    const filt = FILTERS[setup.filter || 'none'];
    const K = (setup.kBase || 0) + sub.gravel * SUBSTRATES.gravel.surf + (sub.soil + sub.amazonia_soil) * SUBSTRATES.soil.surf + filt.K;
    const L = computeLight(layout, setup.lamp);
    let lightSum = 0, n = 0;
    for (let r = 0; r < layout.H; r++) for (let c = 0; c < layout.W; c++) {
      const cell = layout.cells[r][c];
      if (!cell || cell.t !== 'sub') { lightSum += L[r][c]; n++; }
    }
    const meanLight = n ? lightSum / n : 0;
    let absorb = 0;
    const plants = listPlants(layout);
    for (const pl of plants) {
      const p = PLANTS[pl.id];
      const lf = lightFactor(p, plantLight(L, pl));
      absorb += p.absorb * 1.0 * (0.35 + 0.65 * lf) * (setup.co2 ? 1.3 : 1);
    }
    return {
      V, waste, load, clean, fish, K: Math.round(K), meanLight, absorb, plants: plants.length, sub,
      capRatio: waste > 0 ? (K * SIMCFG.BAC_EFF) / waste : 99,
      light: L,
    };
  }

  function lightFactor(p, l) {
    if (p.kind === 'shade' || p.kind === 'epi') return clamp(l / 0.35, 0.25, 1);
    if (p.kind === 'float') return clamp(l / 0.6, 0.2, 1);
    // 有茎草: 必要光量を下回ると急激に弱る
    return clamp((l - p.need * 0.6) / (1 - p.need * 0.6), 0.05, 1);
  }

  // シミュレーション状態の生成
  function create(stage, setup) {
    const layout = setup.layout;
    const a = analyze(layout, setup);
    const L = a.light;
    const plants = listPlants(layout).map((pl, i) => {
      const p = PLANTS[pl.id];
      return {
        i, id: pl.id, c: pl.c, r: pl.r, kind: p.kind,
        b: 1.0, age: 0, light: plantLight(L, pl), feed: rootFeed(layout, pl),
        melting: false, gone: false, absorbed: 0,
      };
    });
    // 個体差: 同種でも弱い個体から倒れるよう、決定論的に ±15% の頑健さを振る(再現性のため乱数は使わない)
    const creatures = setup.creatures.map((cr, i) => ({
      i, id: cr.id, x: cr.x, y: cr.y, hp: 100, alive: true, deathDay: 0, cause: null, sick: 0,
      hardy: 1 + (((i * 37 + 11) % 13) - 6) / 40, minHp: 100,
    }));
    const seed = (stage.seed || 0) + (setup.bottles || 0) * SIMCFG.BOTTLE_SEED;
    return {
      day: 0, days: stage.days, V: a.V, K: a.K, Kfilter: FILTERS[setup.filter || 'none'].K,
      lamp: setup.lamp, co2: !!setup.co2,
      nh3: 0, no2: 0, no3: 0, algae: stage.algae0 || 0,
      bacA: seed, bacB: seed * 0.6,
      plants, creatures, corpses: [],
      sub: a.sub, meanLight: a.meanLight,
      events: (stage.events || []).map(e => ({ ...e })),
      history: [], log: [],
      peak: { nh3: 0, no2: 0, no3: 0, algae: 0 },
      firstDeathDay: 0, ended: false, endReason: null,
      minAlive: stage.goal ? stage.goal.min : 1,
      goal: stage.goal || { min: 1, kind: 'any' },
    };
  }

  const conc = (s, m) => m * SIMCFG.VREF / s.V;

  function activeEvents(s) {
    return s.events.filter(e => s.day >= e.day && s.day < e.day + (e.len || 1));
  }

  function aliveCount(s, kind, species) {
    let n = 0;
    for (const c of s.creatures) {
      if (!c.alive) continue;
      if (species && c.id !== species) continue;
      const k = SPECIES[c.id].kind;
      if (kind === 'fish' && k !== 'fish') continue;
      n++;
    }
    return n;
  }

  // 1日ぶんの更新。戻り値: その日の出来事(描画・実況用)
  function step(s) {
    s.day++;
    const out = { deaths: [], eventsStarted: [], melts: [] };
    // ── イベント倍率 ──
    const mul = { waste: 1, bac: 1, filter: 1, light: 1, bacGrow: 1 };
    for (const e of activeEvents(s)) {
      const d = EVENT_DEFS[e.type];
      if (e.day === s.day) out.eventsStarted.push(e);
      if (d.mul) for (const k in d.mul) mul[k] *= d.mul[k];
      if (d.burst && e.day === s.day) {
        if (d.burst.perSoil) s.nh3 += d.burst.perSoil * (s.sub.soil + s.sub.amazonia_soil) + d.burst.perGravel * s.sub.gravel;
        if (d.burst.flat) s.nh3 += d.burst.flat;
        if (d.burst.algae) s.algae = clamp(s.algae + d.burst.algae, 0, 100);
      }
    }
    // ── 汚染の発生 ──
    let clean = 0, scav = false;
    for (const c of s.creatures) {
      if (!c.alive) continue;
      const sp = SPECIES[c.id];
      s.nh3 += sp.waste * mul.waste;
      clean += sp.clean;
      if (sp.scav) scav = true;
    }
    // 死骸の分解
    for (const cp of s.corpses) {
      if (cp.left <= 0) continue;
      const part = cp.total / SIMCFG.DECAY_DAYS;
      s.nh3 += part * (scav ? SIMCFG.SCAVENGE : 1);
      cp.left--;
    }
    // 高級ソイルの初期溶出
    if (s.sub.amazonia_soil > 0 && s.day <= SUBSTRATES.amazonia_soil.leakDays) {
      s.nh3 += SUBSTRATES.amazonia_soil.leak * s.sub.amazonia_soil;
    }

    // ── バクテリア(住処=容量K。停電中はフィルター分の住処が働かない) ──
    const Keff = Math.max(1, (s.K - s.Kfilter * (1 - mul.filter)));
    const growA = SIMCFG.BAC_GROWTH * mul.bacGrow;
    // A: アンモニア→亜硝酸
    const capA = Math.min(s.bacA, Keff) * SIMCFG.BAC_EFF * mul.bac;
    const pA = Math.min(s.nh3, capA);
    s.nh3 -= pA; s.no2 += pA;
    if (s.nh3 + pA > 0.05) s.bacA += growA * s.bacA * (1 - s.bacA / Keff) + SIMCFG.BAC_COLONIZE * Keff * mul.bacGrow;
    else s.bacA *= SIMCFG.BAC_STARVE;
    s.bacA = clamp(s.bacA, 0.1, Keff);
    // B: 亜硝酸→硝酸塩(Aより定着が遅い)
    const capB = Math.min(s.bacB, Keff) * SIMCFG.BAC_EFF * mul.bac;
    const pB = Math.min(s.no2, capB);
    s.no2 -= pB; s.no3 += pB;
    if (s.no2 + pB > 0.05) s.bacB += growA * 0.8 * s.bacB * (1 - s.bacB / Keff) + SIMCFG.BAC_COLONIZE * 0.7 * Keff * mul.bacGrow;
    else s.bacB *= SIMCFG.BAC_STARVE;
    s.bacB = clamp(s.bacB, 0.1, Keff);

    // ── 水草 ──
    let biomass = 0;
    const no3c = conc(s, s.no3);
    for (const pl of s.plants) {
      if (pl.gone) continue;
      const p = PLANTS[pl.id];
      pl.age++;
      const lf = lightFactor(p, pl.light * mul.light) * (mul.light === 0 ? 0 : 1);
      if (p.life > 0 && pl.age > Math.round(p.life * (s.co2 ? 0.8 : 1)) && !pl.melting) { pl.melting = true; pl.meltCause = 'age'; out.melts.push(pl); }
      // 有茎草は暗い場所に置かれ続けると溶ける(浮草の真下・深い段など)。停電・消灯イベント中は数えない
      if (p.kind === 'stem' && !pl.melting && mul.light > 0) {
        if (lf < 0.25) pl.dark = (pl.dark || 0) + 1; else pl.dark = Math.max(0, (pl.dark || 0) - 1);
        if (pl.dark > SIMCFG.DARK_MELT_DAYS) { pl.melting = true; pl.meltCause = 'dark'; out.melts.push(pl); }
      }
      if (pl.melting) {
        // 寿命を迎えた有茎草は溶けてアンモニア源に反転する
        const loss = Math.min(pl.b, 0.09 * pl.b + 0.04);
        pl.b -= loss; s.nh3 += loss * 2.2;
        if (pl.b < 0.15) { pl.gone = true; s.nh3 += pl.b * 2.2; pl.b = 0; }
        continue;
      }
      const nut = clamp(no3c / (no3c + 4) + pl.feed + (p.kind === 'float' ? 0.15 : 0), 0, 1.2);
      const g = p.grow * lf * nut * (s.co2 ? 1.4 : 1);
      pl.b += g * pl.b * (1 - pl.b / p.bmax);
      // 吸収: アンモニアを優先して一部、残りを硝酸塩から
      const cap = p.absorb * pl.b * (0.25 + 0.75 * lf) * (s.co2 ? 1.25 : 1);
      const takeA = Math.min(s.nh3, cap * p.nh);
      s.nh3 -= takeA;
      const takeN = Math.min(s.no3, cap - takeA);
      s.no3 -= takeN;
      pl.absorbed += takeA + takeN;
      biomass += pl.b;
    }
    s.biomass = biomass;

    // ── コケ: 余った硝酸塩 × 光。水草が多いほど競争で抑えられる ──
    const lightNow = s.meanLight * mul.light;
    const no3c2 = conc(s, s.no3);
    const gAlg = SIMCFG.ALGAE_K * Math.max(0, no3c2 - SIMCFG.ALGAE_NO3_TH) * Math.pow(lightNow, 2) / (1 + biomass * SIMCFG.ALGAE_COMPETE);
    s.algae = clamp(s.algae + gAlg - clean * (s.algae > 0 ? 1 : 0) * 0.9, 0, 100);

    // ── 生体へのダメージ ──
    const A = conc(s, s.nh3), N = conc(s, s.no2), Nt = conc(s, s.no3);
    for (const c of s.creatures) {
      if (!c.alive) continue;
      const sp = SPECIES[c.id];
      const dA = Math.max(0, A - sp.tolA * c.hardy) * SIMCFG.DMG_NH3 / c.hardy;
      const dN = Math.max(0, N - sp.tolN * c.hardy) * SIMCFG.DMG_NO2 / c.hardy;
      const dT = Math.max(0, Nt - SIMCFG.DMG_NO3_TH * c.hardy) * SIMCFG.DMG_NO3 / c.hardy;
      const dO = s.algae > SIMCFG.ALGAE_O2_TH ? (s.algae - SIMCFG.ALGAE_O2_TH) * SIMCFG.ALGAE_O2_DMG / c.hardy : 0;
      const dmg = dA + dN + dT + dO;
      if (dmg > 0.01) {
        c.hp -= dmg; c.sick = Math.min(1, dmg / 8);
        const top = Math.max(dA, dN, dT, dO);
        c.lastCause = top === dA ? 'nh3' : top === dN ? 'no2' : top === dO ? 'o2' : 'no3';
      } else { c.hp = Math.min(100, c.hp + SIMCFG.HP_REGEN); c.sick = Math.max(0, c.sick - 0.2); }
      if (c.hp < c.minHp) c.minHp = Math.max(0, c.hp);
      if (c.hp <= 0) {
        c.hp = 0; c.alive = false; c.deathDay = s.day; c.cause = c.lastCause;
        s.corpses.push({ total: sp.body, left: SIMCFG.DECAY_DAYS });
        out.deaths.push(c);
        if (!s.firstDeathDay) s.firstDeathDay = s.day;
      }
    }

    // ── 記録 ──
    const rec = {
      d: s.day, a: A, n: N, t: Nt, g: s.algae, ba: s.bacA, bb: s.bacB, k: Keff,
      alive: aliveCount(s), fish: aliveCount(s, 'fish'), bio: biomass,
    };
    s.history.push(rec);
    if (A > s.peak.nh3) { s.peak.nh3 = A; s.peak.nh3Day = s.day; }
    if (N > s.peak.no2) { s.peak.no2 = N; s.peak.no2Day = s.day; }
    if (Nt > s.peak.no3) { s.peak.no3 = Nt; s.peak.no3Day = s.day; }
    if (s.algae > s.peak.algae) { s.peak.algae = s.algae; s.peak.algaeDay = s.day; }

    // ── 終了判定: 目標数を割ったら、崩壊を2日だけ見せて打ち切る ──
    const goalAlive = goalCount(s);
    if (goalAlive < s.goal.min) {
      if (!s.failDay) s.failDay = s.day;
      if (s.day - s.failDay >= 2 || aliveCount(s) === 0) { s.ended = true; s.endReason = 'fail'; }
    }
    if (s.day >= s.days && !s.ended) { s.ended = true; s.endReason = goalAlive >= s.goal.min ? 'clear' : 'fail'; }
    return out;
  }

  function goalCount(s) {
    const g = s.goal;
    return aliveCount(s, g.kind === 'fish' ? 'fish' : null, g.species || null);
  }

  function run(stage, setup) {
    const s = create(stage, setup);
    while (!s.ended) step(s);
    return s;
  }

  // 星判定: cond = {t:'noDeath'} | {t:'algae', max} | {t:'nh3', max} | {t:'plantsMax', max} | {t:'alive', min, species?} | {t:'biomass', min}
  function judge(stage, s, setup) {
    const clear = s.endReason === 'clear';
    const checks = (stage.stars || []).map(cond => clear && checkCond(cond, s, setup));
    return { clear, stars: [clear, ...checks], score: score(s) };
  }
  function checkCond(cond, s, setup) {
    switch (cond.t) {
      case 'noDeath': return s.creatures.every(c => c.alive);
      case 'algae': return s.peak.algae <= cond.max;
      case 'nh3': return s.peak.nh3 <= cond.max;
      case 'no2': return s.peak.no2 <= cond.max;
      case 'plantsMax': return s.plants.length <= cond.max;
      case 'alive': return aliveCount(s, cond.kind || null, cond.species || null) >= cond.min;
      case 'loadMin': return setup.creatures.reduce((a, c) => a + SPECIES[c.id].load, 0) >= cond.min;
      case 'biomass': return (s.biomass || 0) >= cond.min;
      case 'species': return new Set(s.creatures.filter(c => c.alive).map(c => c.id)).size >= cond.min;
    }
    return false;
  }

  // フリーラボ用スコア: 生き残った命の価値 × 安定度 + 水草 + 多様性
  function score(s) {
    let life = 0; const kinds = new Set();
    for (const c of s.creatures) if (c.alive) { life += SPECIES[c.id].value; kinds.add(c.id); }
    let flora = 0;
    for (const p of s.plants) if (!p.gone) flora += PLANTS[p.id].value * p.b;
    const calm = 1 + Math.max(0, 1 - (s.peak.nh3 + s.peak.no2) / 12) * 0.5;
    const algaeMul = 1 - Math.min(0.5, s.peak.algae / 200);
    const div = 1 + Math.max(0, kinds.size - 1) * 0.12;
    const survive = s.endReason === 'clear' ? 1 : s.day / s.days * 0.4;
    return Math.round((life * calm * div + flora) * algaeMul * survive * 10);
  }

  // 配置可否。戻り値 null=OK / 文字列=理由コード(UI側で翻訳)
  function isSub(cell) { return cell && cell.t === 'sub'; }
  function canPlaceSub(layout, maxRows, c, r) {
    if (c < 0 || r < 0 || c >= layout.W || r >= layout.H) return 'out';
    if (layout.cells[r][c]) return 'occupied';
    if (r < layout.H - maxRows) return 'subHeight';

  ds_plant_ludwigia: ['ロタラより強く吸う赤い有茎草。光が要る。', 'A red stem plant that out-absorbs Rotala. Needs light.'],

  // ── 図鑑本文 ──
  lore_fish_s: ['アマゾン川流域に生息していた小型美魚の復元体。健気に群れをなして泳ぐ姿は、荒廃した研究員の心を激しく揺さぶる。しかしシステム上は、水を汚す「初期アンモニア発生源」としてカウントされる。\n\n美しさと毒。これが命の本質である。', 'A restored specimen of the small ornamental fish that once lived in the Amazon basin. Their brave schooling stirs the hearts of weary researchers. Yet the system counts them as an "initial ammonia source" that fouls the water.\n\nBeauty and toxin. That is the essence of life.'],
  lore_guppy: ['「ミリオンフィッシュ」の異名を持つ小型美魚の復元体。オスの尾びれは万華鏡のように鮮やかで、色彩は個体ごとに異なる。\n\n水質の揺れに強く、立ち上げの荒波を越えやすい。', 'A small ornamental fish once called "the million fish." The males\' tails shimmer like kaleidoscopes, each pattern unique.\n\nHardy against swings in water quality, it weathers the start-up storm well.'],
  lore_fish_m: ['熱帯域に生息した温和な中型魚の復元体。存在感のある体型と模様が水槽の審美性を高める。アンモニア排出量はテトラの2倍を超える。ろ過基盤なき配備は崩壊を早める。', 'A peaceful mid-size fish from the tropics. Its presence and pattern elevate the tank\'s beauty. Its ammonia output exceeds twice a tetra\'s. Deployment without a mature filter hastens collapse.'],
  lore_fish_l: ['かつて「水槽の女王」と呼ばれた大型個体の復元体。その優雅なヒレの動きに誰もが見惚れるが、環境に与える負荷はテトラの数倍。彼女を美しく泳がせるには、完璧なろ過基盤という「神の血の代償」が必要となる。', 'A large specimen once called "the queen of the aquarium." Everyone is entranced by her fins, but her burden on the environment is several times a tetra\'s. To let her swim beautifully, you must pay "the god\'s blood price": a perfect filtration foundation.'],
  lore_discus: ['「熱帯魚の王様」と呼ばれた円盤形の大型美魚の復元体。堂々たる体型は水槽内のあらゆる生体を圧倒する。だが、極めて高い水質感受性を併せ持つ。\n\n王を迎えるには、王に相応しい環境が必要だ。', 'A disc-shaped specimen once called "the king of tropical fish." Its majestic form overwhelms every other resident. But it is extremely sensitive to water quality.\n\nTo receive a king, you need a kingdom worthy of him.'],
  lore_arowana: ['太古から形を変えずに生き延びた古代魚の頂点。その鱗は研究員に畏敬の念を抱かせる。毒には強いが、排泄量は他の命とは桁が違う。\n\n究極の命を預かるのは、究極の覚悟を持つ神だけだ。', 'The apex of ancient fish, unchanged since primeval times. Its scales fill researchers with awe. It shrugs off toxins, but its waste is on a different scale from any other life.\n\nOnly a god with ultimate resolve may hold the ultimate life.'],
  lore_corydoras: ['パンダのような模様を持つ小型底棲魚の復元体。底床をせわしなくつつく仕草は研究員たちの心を和ませる。仲間の死骸を片付け、腐敗の毒を半分に抑える。', 'A small bottom dweller with a panda-like pattern. Its busy pecking at the substrate soothes the researchers. It clears away the dead, halving the poison of decay.'],
  lore_clown_loach: ['鮮烈なオレンジと漆黒のストライプを纏う中型底棲魚の復元体。横たわって眠る奇妙な習性があり、初見で死亡と誤認されることも。死骸を片付けるが、排泄はグラミー級だ。', 'A mid-size bottom dweller in vivid orange and black. It sleeps on its side and is often mistaken for dead. It clears corpses, but its waste rivals a gourami\'s.'],
  lore_sailfin_pleco: ['巨大な帆のような背ビレを誇示する大型コケ取り魚の復元体。ガラス面のコケを貪欲に食べ尽くすが、自身も相当量の排泄を出す。\n\n清掃と汚染の二律背反。それがこの生体の本質である。', 'A large algae eater flaunting a sail-like dorsal fin. It devours algae from the glass, but produces considerable waste itself.\n\nCleaning and polluting at once. That is its nature.'],
  lore_otos: ['ガラス面に張りつき、コケを専門的に食べる小さな有機アセット。目立たず、休まず、コケの芽を摘み続ける。水質急変への耐性は低い。', 'A tiny organic asset that clings to the glass and specializes in eating algae. Unseen and untiring, it keeps nipping algae in the bud. It tolerates sudden changes poorly.'],
  lore_shrimp: ['水槽のコケをひたすら毟り取る、健気な有機掃除アセット。生体キャパシティを消費しない忠実な下僕だが、亜硝酸には魚よりもはるかに敏感。彼らが動かなくなる時、それは世界崩壊の炭鉱のカナリアである。', 'A diligent organic cleaning asset that plucks algae without rest. A loyal servant that consumes no bio-capacity, yet far more sensitive to nitrite than any fish. When they stop moving, they are the canary in the coal mine of a collapsing world.'],
  lore_plant_stem: ['急速展開型の有茎草。光を浴びて新芽を伸ばし、毒をスポンジのように吸い上げる。だが寿命を迎えるか、光を失うと、一転して溶け落ち、最悪の汚染源へと反転する。\n\n生か死か。それを決めるのは神の設計である。', 'A fast-spreading stem plant. It stretches toward the light and drinks toxins like a sponge. But when its life ends — or its light is stolen — it melts and turns into the worst pollutant.\n\nLife or death. The god\'s design decides.'],
  lore_plant_ludwigia: ['赤みを帯びた葉を持つ有茎草の復元体。ロタラを上回る吸収力と、やや長い寿命を持つ。光への要求は高い。', 'A stem plant with reddish leaves. It out-absorbs Rotala and lives slightly longer, but demands strong light.'],
  lore_plant_wide: ['水中を漂うリボン状の葉を持つ有茎草。横2マスに根を張り、長い寿命で中盤以降を支える。', 'A stem plant with ribbon-like leaves drifting in the water. It roots across two cells and supports the mid-to-late game with its long life.'],
  lore_plant_tall: ['縦2マスにわたって葉を広げる大型の有茎草。暗さに比較的強く、寿命も長い。存在感のある葉は水槽のシンボルになる。', 'A large stem plant spreading across two cells of height. Comparatively tolerant of dim light, and long-lived. Its leaves become the tank\'s symbol.'],
  lore_plant_anubias: ['日陰でもじっと耐え忍ぶ、驚異的なタフさを持つ陰性植物。成長は遅く、華やかさもないが、100日間の過酷な実験においても「決して枯れない」。神が最も信頼すべき緑の盾。\n\n派手さより、生き残ること。それが真の強さだ。', 'A shade plant of astonishing toughness. Slow and plain, but over a hundred brutal days it never dies. The green shield a god should trust most.\n\nSurvival over spectacle. That is true strength.'],
  lore_plant_willow_moss: ['どんな底床にも活着する深緑の苔類。吸収は控えめだが、枯れず、場所を選ばない。設計の隙間を埋める柔軟な選択肢。', 'A deep-green moss that attaches to any substrate. Modest uptake, but immortal and unfussy. A flexible piece for filling the gaps in a design.'],
  lore_plant_frogbit: ['水面に浮かぶ小さな円葉の浮草。底床を必要とせず、よく吸い、よく増える。ただし葉の下は暗い。その影は、コケを抑える盾にも、有茎草を殺す刃にもなる。', 'A small round-leafed plant floating on the surface. It needs no substrate and absorbs well. But beneath its leaves it is dark — a shadow that can shield against algae, or kill stem plants below.'],
  lore_gravel: ['鉱物性の中性底床材。水草は根付かないが、無数の隙間がバクテリアの最良の住処になる。地震で舞い上がる汚れも少ない。', 'A neutral mineral substrate. Plants cannot root, but its countless gaps make the best home for bacteria. It releases little muck in a quake.'],
  lore_soil: ['滅びた地球の土壌を模倣して合成された、水草のための基盤。根に栄養を与えるが、汚れも溜め込む。', 'A synthetic substrate imitating the soil of the dead Earth. It feeds roots, but it also stores muck.'],
  lore_amazonia_soil: ['水草育成に特化した高級ソイル。根に強い栄養を与えるが、最初の2週間はアンモニアを溶出する危険な特性を持つ。\n\n神よ、立ち上げの代償を忘れるな。', 'A premium soil built for plants. It feeds roots richly, but leaches ammonia for its first two weeks.\n\nGod, do not forget the start-up price.'],
  lore_sponge: ['エアで水を吸い込む簡素なフィルター。ろ材は小さいが、停電で失うものも小さい。', 'A simple air-driven filter. Small media — and small losses in a blackout.'],
  lore_hangon: ['水槽の縁に掛ける標準的なフィルター。住処とリスクの釣り合いが取れている。', 'A standard filter hung on the rim. A balance of capacity and risk.'],
  lore_canister: ['大容量のろ材を抱える外部フィルター。バクテリアの大都市だが、電源が落ちれば都市ごと死ぬ。', 'An external filter holding a large volume of media. A metropolis for bacteria — and if the power fails, the whole city dies.'],
  lore_co2: ['水草に炭素を供給し、成長と吸収を加速させる。命を早送りする装置。燃え尽きるのも早い。', 'Feeds carbon to plants, accelerating growth and uptake. A device that fast-forwards life — and makes it burn out sooner.'],
  lore_bottle: ['培養済みのバクテリアを封入した瓶。密閉の瞬間に投入し、「見えない戦争」を前倒しで終わらせる。', 'A bottle of cultured bacteria. Added at the moment of sealing, it ends the invisible war ahead of schedule.'],

  dt_early: ['<b>立ち上げリスク</b><br>密閉直後、バクテリアが育つ前に溜まる毒の目安。生体を減らす・砂利やフィルターで住処を増やす・バクテリア剤で下がる。', '<b>Start-up risk</b><br>How much poison builds up before bacteria grow. Lower it with fewer animals, more gravel/filter homes, or bacteria bottles.'],
  dt_bal: ['<b>長期バランス</b><br>育ちきった水草の吸収力と排泄量の釣り合い。不足すると硝酸塩が溜まり、コケと慢性中毒を招く。寿命のある有茎草は割り引いて評価。', '<b>Long-term balance</b><br>Mature plant uptake versus waste. If short, nitrate accumulates, feeding algae and chronic poisoning. Short-lived stems count for less.'],
  dt_alg: ['<b>コケリスク</b><br>照明の強さ × 吸収の不足ぶり。浮草の影・照明を下げる・掃除役で下がる。', '<b>Algae risk</b><br>Light intensity × uptake shortfall. Lower it with floating shade, a dimmer lamp, or cleaners.'],
  seal_first: ['初回の密閉 — 成功すれば ONE-SHOT', 'First seal — succeed for ONE-SHOT'], seal_sub: ['ハッチを密閉して観測を開始', 'Seal the hatch and begin observation'], seal_need: ['目標未達: {g}', 'Goal not met: {g}'],

  co_sub: ['まず「底床」から選び、水槽の一番下をクリック。ドラッグで連続して敷ける。', 'First pick a substrate and click the bottom row. Drag to paint a whole row.'],
  co_cre: ['「生体」の ＋ で命を入れる。泳ぐ位置は気にしなくていい。', 'Use ＋ in LIFE to add animals. Where they swim does not matter.'],
  co_plant: ['水草は硝酸塩を吸う唯一の手段。ソイルの真上に植えられる。', 'Plants are the only thing that removes nitrate. Plant them on soil.'],
  co_goal: ['目標に届いていない: {g}', 'Goal not reached: {g}'],
  co_float: ['浮草は水面に浮かべる。真下の列が暗くなる——有茎草の上は避けろ。', 'Floating plants sit on the surface and darken the column below — keep them off your stem plants.'],

const lerp = (a, b, k) => a + (b - a) * k;

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// ===== SAVE =====
const SAVE_DEF = {
  v: 3, lang: null, opening: false,
  settings: { bgm: 0.6, se: 0.8, speed: 1, reduce: false, grid: true },
  stages: {},     // id → { stars:[b,b,b], oneShot, attempts, clears, layout }
  seen: {},       // 図鑑の解放
  stats: { seals: 0, clears: 0, deaths: 0, oneShots: 0, days: 0 },
  ach: {},
  lab: { best: 0, runs: 0, cfg: null, layout: null, daily: { date: '', best: 0 } },
};
const Save = (() => {
  let d = null;
  const fresh = () => JSON.parse(JSON.stringify(SAVE_DEF));
  function fill(t, s) {
    for (const k of Object.keys(s)) {
      if (t[k] === undefined || t[k] === null && s[k] !== null) t[k] = JSON.parse(JSON.stringify(s[k]));
      else if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && typeof t[k] === 'object') fill(t[k], s[k]);
    }
  }
  function load() {
    try {
      const raw = localStorage.getItem(CONFIG.SAVE_KEY);
      d = raw ? JSON.parse(raw) : fresh();
      if (!d || typeof d !== 'object' || d.v !== 3) d = fresh();
    } catch (e) { d = fresh(); }   // 壊れたセーブでも起動できるよう初期化して続行
    fill(d, SAVE_DEF);
    for (const k of ['stages', 'seen', 'ach', 'stats', 'settings', 'lab']) if (!d[k] || typeof d[k] !== 'object' || Array.isArray(d[k])) d[k] = JSON.parse(JSON.stringify(SAVE_DEF[k]));
    fill(d, SAVE_DEF);
    for (const id of Object.keys(d.stages)) {
      const r = d.stages[id];
      if (!r || typeof r !== 'object') { delete d.stages[id]; continue; }
      if (!Array.isArray(r.stars)) r.stars = [false, false, false];
      r.stars = [0, 1, 2].map(i => !!r.stars[i]);
      r.attempts = Number.isFinite(r.attempts) ? r.attempts : 0; r.clears = Number.isFinite(r.clears) ? r.clears : 0; r.oneShot = !!r.oneShot;
      if (r.layout && (!Array.isArray(r.layout.cells) || !Array.isArray(r.layout.cre))) r.layout = null;
    }
    if (!d.lab.daily || typeof d.lab.daily !== 'object') d.lab.daily = { date: '', best: 0 };
    return d;
  }
  let timer = null;
  function persist(now) {
    clearTimeout(timer);
    const w = () => { try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(d)); } catch (e) { /* 容量不足・プライベートモードは無視 */ } };
    if (now) w(); else timer = setTimeout(w, 250);
  }
  function stage(id) { if (!d.stages[id]) d.stages[id] = { stars: [false, false, false], oneShot: false, attempts: 0, clears: 0, layout: null }; return d.stages[id]; }
  function oldSaveExists() { try { const o = JSON.parse(localStorage.getItem(CONFIG.OLD_SAVE_KEY) || 'null'); return !!(o && o.runs > 0); } catch (e) { return false; } }
  function reset() { d = fresh(); try { localStorage.removeItem(CONFIG.OLD_SAVE_KEY); } catch (e) { /* 無視 */ } persist(true); }
  return { load, persist, stage, reset, oldSaveExists, get data() { return d; } };
})();

// BGMは <audio> を WebAudio のゲイン経由で鳴らす(iOSは audio.volume を無視するため)。SEはデコード済みバッファ。
const AU = (() => {
  const B = 'assets/audio/';
  const BGM = {
    opening: B + 'bgm/bgm_opening.mp3', title: B + 'bgm/bgm_title.mp3', menu: B + 'bgm/bgm_menu.mp3',
    setup: B + 'bgm/bgm_setting.mp3', observe: B + 'bgm/bgm_simulation.mp3', clear: B + 'bgm/bgm_gameclear.mp3',
    fail: B + 'bgm/bgm_gameover.mp3', lab: B + 'bgm/bgm_lab.mp3',
  };
  const SE = { ok: 'se_place_ok', ng: 'se_place_ng', rm: 'se_remove', start: 'se_start', event: 'se_event', crit: 'se_critical', up: 'se_upgrade', click: 'se_ui_click', clear: 'se_clear' };
  let ctx = null, master = null, bgmBus = null, seBus = null, cur = null, unlocked = false, wantKey = null;
  // file:// で開いた場合、Chrome は WebAudio 経由の音声を無音にし、fetch も使えない。<audio> 直接再生に切り替える
  const LOCAL = location.protocol === 'file:';
  const seEl = {};
  const buf = {}, cool = {};
  function vol() { return Save.data ? Save.data.settings : SAVE_DEF.settings; }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain(); master.connect(ctx.destination);
      bgmBus = ctx.createGain(); bgmBus.connect(master);
      seBus = ctx.createGain(); seBus.connect(master);
      applyVol();
      if (ctx.state === 'suspended') ctx.resume();
      for (const k of Object.keys(SE)) loadSE(k);
    } catch (e) { ctx = null; }
    ensurePool();
    primePool().then(() => { if (wantKey) { const k = wantKey; wantKey = null; bgm(k); } });
  }
  function loadSE(k) {
    if (LOCAL) { const a = new Audio(B + 'se/' + SE[k] + '.mp3'); a.preload = 'auto'; seEl[k] = a; return; }
    fetch(B + 'se/' + SE[k] + '.mp3').then(r => r.arrayBuffer()).then(ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej))).then(b => { buf[k] = b; }).catch(() => { /* file:// 等で読めない場合は無音で続行 */ });
  }
  function applyVol() {
    if (cur && !cur.g) cur.el.volume = vol().bgm * 0.55;
    if (!ctx) return;
    const s = vol();
    bgmBus.gain.setTargetAtTime(s.bgm * 0.55, ctx.currentTime, 0.05);
    seBus.gain.setTargetAtTime(s.se * 0.9, ctx.currentTime, 0.05);
  }
  // BGM用の <audio> は2本だけ作って使い回す(iOS は「一度ユーザー操作で再生した要素」しか自動再生を許さないため)
  const pool = [];
  function ensurePool() {
    if (pool.length) return;
    for (let i = 0; i < 2; i++) {
      const el = new Audio(); el.preload = 'auto';
      let g = null;
      if (ctx && !LOCAL) { try { const src = ctx.createMediaElementSource(el); g = ctx.createGain(); g.gain.value = 0; src.connect(g); g.connect(bgmBus); } catch (e) { g = null; } }
      pool.push({ el, g, key: null });
    }
  }
  let priming = false;
  function primePool() {   // 最初のタップの中で両方を一瞬だけ無音再生して「解禁」しておく
    priming = true;
    return Promise.all(pool.map(p => {
      p.el.src = BGM.title; p.el.muted = true;
      const pr = p.el.play();
      return (pr && pr.then ? pr : Promise.resolve()).then(() => { if (p !== cur) p.el.pause(); }).catch(() => {}).then(() => { p.el.muted = false; });
    })).then(() => { priming = false; });
  }
  function fadeTo(p, v, sec) {
    if (p.g && ctx) { const t0 = ctx.currentTime; p.g.gain.cancelScheduledValues(t0); p.g.gain.setValueAtTime(p.g.gain.value, t0); p.g.gain.linearRampToValueAtTime(v, t0 + sec); }
    else {   // WebAudio を使えない環境: 要素の音量を少しずつ動かしてフェードする
      clearInterval(p.fadeI); const from = p.el.volume, to = clamp(v * vol().bgm * 0.55, 0, 1), t0 = performance.now();
      p.fadeI = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / (sec * 1000)); p.el.volume = from + (to - from) * k; if (k >= 1) clearInterval(p.fadeI); }, 50);
    }
  }
  function bgm(key) {
    if (!unlocked || !pool.length || priming) { wantKey = key; return; }
    if (cur && cur.key === key) return;
    const fade = CONFIG.BGM_FADE, old = cur;
    if (old) { fadeTo(old, 0, fade); clearTimeout(old.stopT); old.stopT = setTimeout(() => { if (old !== cur) old.el.pause(); }, fade * 1000 + 80); old.key = null; }
    cur = null;
    if (!key || !BGM[key]) return;
    const p = old === pool[0] ? pool[1] : pool[0];   // 鳴っていた方と交互に使う(素早く切り替えても最大2本)
    clearTimeout(p.stopT);
    p.key = key; p.el.loop = key !== 'opening';
    if (!p.el.src.endsWith(BGM[key])) p.el.src = BGM[key];
    try { p.el.currentTime = 0; } catch (e) { /* 未読込のときは無視 */ }
    if (p.g && ctx) p.g.gain.value = 0; else p.el.volume = 0;
    const pr = p.el.play(); if (pr && pr.catch) pr.catch(() => {});
    fadeTo(p, 1, fade);
    cur = p;
  }
  function se(k, v = 1, rate = 1) {
    const now = performance.now();
    if (cool[k] && now - cool[k] < 60) return;   // 連打で同じ音が重なりすぎないように
    if (LOCAL) {
      if (!seEl[k]) return; cool[k] = now;
      const a = seEl[k].cloneNode(); a.volume = clamp(v * vol().se * 0.9, 0, 1); a.playbackRate = rate;
      const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); return;
    }
    if (!ctx || !buf[k]) return;
    cool[k] = now;
    const s = ctx.createBufferSource(); s.buffer = buf[k]; s.playbackRate.value = rate;
    const g = ctx.createGain(); g.gain.value = v;
    s.connect(g); g.connect(seBus); s.start();
  }
  // 合成音: 死・泡・星・密閉など、既存素材にない音をその場で作る
  function synth(kind) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const env = (g, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
    const osc = (type, f0, f1, dur, peak, a = 0.005) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
      o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      env(g, a, peak, dur); o.connect(g); g.connect(seBus); o.start(t); o.stop(t + a + dur + 0.05);
    };
    if (kind === 'death') { osc('sine', 660, 330, 1.1, 0.16, 0.01); osc('triangle', 990, 495, 0.9, 0.05, 0.01); }
    else if (kind === 'bubble') osc('sine', 500 + Math.random() * 500, 1400, 0.09, 0.05);
    else if (kind === 'star') { osc('triangle', 880, 0, 0.5, 0.12); osc('sine', 1760, 0, 0.6, 0.05); }
    else if (kind === 'oneshot') { [523, 659, 784, 1047].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * 0.09); g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.09 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.7); o.connect(g); g.connect(seBus); o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.8); }); }
    else if (kind === 'seal') {
      osc('sine', 120, 45, 0.6, 0.35, 0.005);
      const n = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate), ch = n.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 3);
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0.25; s.buffer = n; s.connect(f); f.connect(g); g.connect(seBus); s.start(t);
    }
    else if (kind === 'melt') osc('sine', 220, 150, 0.5, 0.06, 0.03);
    else if (kind === 'tick') osc('square', 1800, 0, 0.02, 0.02);
  }
  function kick() {   // iOS はバックグラウンド復帰後に AudioContext が interrupted のままになることがあるため、タップのたびに確認する
    if (ctx && ctx.state !== 'running' && !document.hidden) ctx.resume();
    if (cur && cur.el.paused && !document.hidden) { const pr = cur.el.play(); if (pr && pr.catch) pr.catch(() => {}); }
  }
  function suspend() { if (ctx && ctx.state === 'running') ctx.suspend(); if (cur) cur.el.pause(); }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); if (cur) { const p = cur.el.play(); if (p && p.catch) p.catch(() => {}); } }
  return { unlock, bgm, se, synth, applyVol, suspend, resume, kick, get ready() { return !!ctx; } };
})();

  plant_ludwigia: 'plants/plant_ludwigia', plant_frogbit: 'plants/plant_frogbit', plant_willow_moss: 'plants/plant_willow_moss', plant_withered: 'plants/plant_stem_s4',
  gravel: 'substrate/gravel', soil: 'substrate/soil', amazonia_soil: 'substrate/amazonia_soil',

  filter: 'upgrades/filter', co2: 'upgrades/co2', bottle: 'upgrades/bacteria', lamp: 'upgrades/tank_up',
};
const IMG = {};     // 元画像
const IMGX = {};    // 加工版(灰色=死・弱り / 茶色=溶け)
const imgPath = id => 'assets/img/' + IMG_SRC[id] + '.png';
function loadImages() {
  return Promise.all(Object.keys(IMG_SRC).map(id => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[id] = im; res(); };
    im.onerror = () => res();   // 画像欠落でも起動は止めない(描画側で存在チェック)
    im.src = imgPath(id);
  }))).then(makeVariants);
}
// ctx.filter は Safari で使えないため、ピクセル加工した別画像を事前に作る
function makeVariants() {
  for (const id of Object.keys(IMG)) {
    const im = IMG[id];
    const isCre = !!SPECIES[id], isPl = !!PLANTS[id];
    if (!isCre && !isPl) continue;
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0);
    let data; try { data = x.getImageData(0, 0, c.width, c.height); } catch (e) { continue; }  // file:// でのtaint対策
    const p = data.data;
    for (let i = 0; i < p.length; i += 4) {
      const l = p[i] * 0.3 + p[i + 1] * 0.59 + p[i + 2] * 0.11;
      if (isCre) { p[i] = l * 0.85 + 30; p[i + 1] = l * 0.85 + 34; p[i + 2] = l * 0.85 + 38; }
      else { p[i] = l * 0.62 + 48; p[i + 1] = l * 0.48 + 28; p[i + 2] = l * 0.25 + 10; }
    }
    x.putImageData(data, 0, 0);
    IMGX[id] = c;
  }
}
function iconTag(id, cls = 'icon') { return IMG_SRC[id] ? `<img class="${cls}" src="${imgPath(id)}" alt="" draggable="false">` : ''; }

// ===== 画面スケーリング =====
let VIEW_SCALE = 1;
function fitApp() {
  const W = 960, H = 540;
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  VIEW_SCALE = s;
  $('app').style.transform = `scale(${s})`;
  for (const tv of TankView.all) tv.resize();
  if (typeof Result !== 'undefined' && Result.redraw) Result.redraw();
}

// ===== トースト / モーダル / ツールチップ =====
let toastT = null;
function toast(msg, ok = false) {
  const el = $('toast'); el.textContent = msg; el.className = ok ? 'ok show' : 'show';
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}
function modal(title, body, buttons, wide) {
  return new Promise(res => {
    const m = $('modal');
    m.querySelector('.box').classList.toggle('wide', !!wide);
    m.querySelector('.mt').textContent = title;
    m.querySelector('.mb').innerHTML = body;
    const bx = m.querySelector('.mbtns'); bx.innerHTML = '';
    buttons.forEach(b => {
      const e = document.createElement('button'); e.className = 'btn ' + (b.cls || ''); e.textContent = b.label;
      e.onclick = () => { m.classList.remove('on'); AU.se('click', 0.6); res(b.v); };
      bx.appendChild(e);
    });
    m.classList.add('on');
  });
}
function tipShow(html, x, y) {
  const el = $('tip'); el.innerHTML = html; el.classList.add('show');
  const r = $('app').getBoundingClientRect();
  let lx = (x - r.left) / VIEW_SCALE + 14, ly = (y - r.top) / VIEW_SCALE + 14;
  const w = el.offsetWidth, h = el.offsetHeight;
  if (lx + w > 950) lx = lx - w - 28; if (ly + h > 532) ly = ly - h - 28;
  el.style.left = lx + 'px'; el.style.top = ly + 'px';
}
function tipHide() { $('tip').classList.remove('show'); }
let tipT = null;
function bindTip(el, fn) {
  el.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { const r = el.getBoundingClientRect(); tipShow(fn(), r.left, r.bottom); clearTimeout(tipT); tipT = setTimeout(tipHide, 2600); } });
  el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') tipShow(fn(), e.clientX, e.clientY); });
  el.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') tipShow(fn(), e.clientX, e.clientY); });
  el.addEventListener('pointerleave', tipHide);
}

// ===== 画面遷移 =====
const Screens = {};
let curScreen = 'boot';
function go(name, arg) {
  tipHide();
  $('app').classList.add('busy'); clearTimeout(go.t); go.t = setTimeout(() => $('app').classList.remove('busy'), 320);
  const prev = curScreen;
  if (Screens[prev] && Screens[prev].leave) Screens[prev].leave();
  const a = $('scr-' + prev), b = $('scr-' + name);
  if (a !== b) {
    a.classList.remove('vis');
    setTimeout(() => { if (curScreen !== prev) a.classList.remove('on'); }, 200);
  }
  curScreen = name;
  b.classList.add('on');
  requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('vis')));
  if (Screens[name] && Screens[name].enter) Screens[name].enter(arg);
}

// ===== TANK RENDERER =====
// 水槽の描画担当。状態(layout/sim)を受け取って描くだけで、ゲーム進行は持たない。
const SWIM = {   // 生体の泳ぎ方: speed=セル/秒, school=群れる
  fish_s: { speed: 1.5, school: true }, guppy: { speed: 1.3, school: true }, fish_m: { speed: 0.9 }, fish_l: { speed: 0.7 },
  discus: { speed: 0.6 }, arowana: { speed: 0.9 }, corydoras: { speed: 0.6, school: true }, clown_loach: { speed: 0.8 },
  sailfin_pleco: { speed: 0.3 }, otos: { speed: 0.25 }, shrimp: { speed: 0.35 },
};
class TankView {
  constructor(canvas, w, h, opts = {}) {
    this.cv = canvas; this.w = w; this.h = h; this.opts = opts;
    this.ctx = canvas.getContext('2d');
    this.layout = null; this.light = null; this.lamp = 2; this.filter = 'sponge';
    this.fish = []; this.bubbles = []; this.parts = []; this.plantVis = new Map();
    this.sim = null; this.hover = null; this.showGrid = false; this.mode = 'setup';
    this.t = 0; this.shake = 0; this.flash = null; this.fx = {}; this.lightMul = 1; this.powerOn = true;
    this.specks = []; const r = mulberry(7);
    for (let i = 0; i < 520; i++) this.specks.push({ x: r(), y: r(), s: 0.6 + r() * 1.8, a: 0.25 + r() * 0.45 });
    this.rays = []; for (let i = 0; i < 6; i++) this.rays.push({ x: r(), w: 0.04 + r() * 0.07, sp: 0.02 + r() * 0.03, ph: r() * 6 });
    TankView.all.push(this);
    this.resize();
  }
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const k = Math.max(1, VIEW_SCALE * dpr);
    this.cv.width = Math.round(this.w * k); this.cv.height = Math.round(this.h * k);
    this.cv.style.width = this.w + 'px'; this.cv.style.height = this.h + 'px';
    this.ctx.setTransform(k, 0, 0, k, 0, 0);
    this.ctx.imageSmoothingEnabled = true; this.ctx.imageSmoothingQuality = 'high';
  }
  // 水槽の幾何を決める。frame=水槽を収める領域
  setLayout(layout) {
    this.layout = layout;
    const f = this.opts.frame || { x: 10, y: 24, w: this.w - 20, h: this.h - 32 };
    const cs = Math.floor(Math.min(f.w / layout.W, f.h / layout.H));
    this.cs = cs; this.ox = Math.round(f.x + (f.w - cs * layout.W) / 2); this.oy = Math.round(f.y + f.h - cs * layout.H);
    this.TW = cs * layout.W; this.TH = cs * layout.H;
    this.recalcLight();
  }
  recalcLight() { if (this.layout) this.light = SIM.computeLight(this.layout, this.lamp); }
  pop(c, r) { (this.pops || (this.pops = new Map())).set(c + ',' + r, this.t); }

  }
  puff(c, r, col) {
    const x = this.ox + (c + 0.5) * this.cs, y = this.oy + (r + 0.5) * this.cs;
    for (let i = 0; i < 12; i++) { const a = Math.random() * 6.283, v = 20 + Math.random() * 50; this.parts.push({ k: 'puff', col, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 10, life: 0.5 + Math.random() * 0.4, s: 1.5 + Math.random() * 2 }); }
  }
  cellAt(px, py) { return { c: Math.floor((px - this.ox) / this.cs), r: Math.floor((py - this.oy) / this.cs) }; }
  // 列の底(最上段の底床)の行番号
  floorRow(c) {
    const L = this.layout; if (!L) return 0;
    c = clamp(Math.floor(c), 0, L.W - 1);
    for (let r = 0; r < L.H; r++) { const cell = L.cells[r][c]; if (cell && cell.t === 'sub') return r; }
    return L.H;
  }

  // ── 生体の見た目 ──
  addFish(id, x, y, extra = {}) {
    const L = this.layout, rnd = Math.random;
    const f = { id, x: x != null ? x : 0.6 + rnd() * (L.W - 1.2), y: y != null ? y : 0.6 + rnd() * (L.H * 0.6), vx: (rnd() - 0.5), vy: 0, tx: 0, ty: 0, tt: 0, ph: rnd() * 6.28, alive: true, hp: 100, sick: 0, deadT: 0, face: rnd() < 0.5 ? -1 : 1, ...extra };
    this.pickTarget(f, true); this.fish.push(f); return f;
  }
  syncFish(list) {   // セットアップ: 生体リスト(個数)に見た目を合わせる
    const want = {}; list.forEach(c => want[c.id] = (want[c.id] || 0) + 1);
    const have = {}; this.fish.forEach(f => have[f.id] = (have[f.id] || 0) + 1);
    for (const id of Object.keys(have)) { let extra = have[id] - (want[id] || 0); for (let i = this.fish.length - 1; i >= 0 && extra > 0; i--) if (this.fish[i].id === id) { this.fish.splice(i, 1); extra--; } }
    for (const id of Object.keys(want)) for (let n = (have[id] || 0); n < want[id]; n++) this.addFish(id);
  }
  zoneBounds(f) {
    const L = this.layout, z = SPECIES[f.id].zone, fr = this.floorRow(f.x);
    if (z === 'top') return [0.45, Math.max(0.6, Math.min(fr - 0.6, L.H * 0.45))];
    if (z === 'bottom') return [Math.max(0.5, fr - 0.45), Math.max(0.5, fr - 0.4)];
    if (z === 'glass') return [0.6, Math.max(0.8, fr - 0.5)];
    return [Math.min(1.0, fr - 0.8), Math.max(1.0, fr - 0.9)];
  }
  pickTarget(f, init) {
    const L = this.layout, sw = SWIM[f.id] || { speed: 1 };
    if (SPECIES[f.id].zone === 'glass') f.tx = Math.random() < 0.5 ? 0.45 : L.W - 0.45;
    else if (sw.school && this.school && this.school[f.id] && !init) { const s = this.school[f.id]; f.tx = s.x + (Math.random() - 0.5) * 1.6; }
    else f.tx = 0.5 + Math.random() * (L.W - 1);
    const fr = this.floorRow(f.tx); const zb = this.zoneBounds({ id: f.id, x: f.tx });
    f.ty = clamp(zb[0] + Math.random() * (zb[1] - zb[0]), 0.4, fr - 0.4);
    f.tt = 2 + Math.random() * 4 / sw.speed;
    if (init) { f.x = clamp(f.x, 0.5, L.W - 0.5); f.y = clamp(f.ty, 0.4, L.H - 0.5); }
  }
  updateFish(dt) {
    const L = this.layout; if (!L) return;
    // 群れの中心を動かす(ネオン等は共通の目標を追う)
    this.school = this.school || {};
    for (const id of ['fish_s', 'guppy', 'corydoras']) {
      const s = this.school[id] || (this.school[id] = { x: L.W / 2, y: L.H / 3, tx: L.W / 2, t: 0 });
      s.t -= dt; if (s.t <= 0) { s.tx = 1 + Math.random() * (L.W - 2); s.t = 3 + Math.random() * 4; }
      s.x += (s.tx - s.x) * Math.min(1, dt * 0.5);
    }
    for (const f of this.fish) {
      const sw = SWIM[f.id] || { speed: 1 };
      if (!f.alive) {
        // 死: 灰色に裏返って水面へ浮き、しばらくして消える
        f.deadT += dt; f.vx *= 0.95; f.y = Math.max(0.25, f.y - dt * 0.9); f.x += f.vx * dt;

      const sp = sw.speed * (1 - f.sick * 0.6) * (this.mode === 'title' ? 0.8 : 1);

      f.x += f.vx * dt; f.y += f.vy * dt;
      const fr = this.floorRow(f.x);
      f.x = clamp(f.x, 0.35, L.W - 0.35); f.y = clamp(f.y, 0.3, Math.max(0.35, fr - 0.3));
      if (Math.abs(f.vx) > 0.05) f.face = f.vx > 0 ? 1 : -1;
    }
    this.fish = this.fish.filter(f => f.alive || f.deadT < 9);
  }

  // ── 泡・粒子 ──
  spawnBubbles(dt) {
    const L = this.layout; if (!L) return;
