      while (this.bAcc > 1) { this.bAcc--; this.bubbles.push({ x: this.ox + this.TW - 7 + (Math.random() - 0.5) * 4, y: this.oy + this.TH - this.cs * 0.6, r: 1 + Math.random() * 2.2, vy: 30 + Math.random() * 30, w: Math.random() * 6 }); }
    }
    // 光合成の泡(元気な水草から)
    if (this.sim && this.lightMul > 0) {
      for (const p of this.sim.plants) {
        if (p.gone || p.melting || p.kind === 'float') continue;
        if (Math.random() < dt * 0.35 * Math.min(1, p.b / 2) * (p.light || 0.5)) {
          const P = PLANTS[p.id];
          this.bubbles.push({ x: this.ox + (p.c + P.w / 2) * this.cs + (Math.random() - 0.5) * this.cs * 0.6, y: this.oy + p.r * this.cs, r: 0.8 + Math.random() * 1.4, vy: 14 + Math.random() * 12, w: Math.random() * 6, o2: true });
        }
      }
    }
  }
  burst(kind, n) {
    const L = this.layout; if (!L) return;
    for (let i = 0; i < n; i++) {
      if (kind === 'dust') { const c = Math.random() * L.W; this.parts.push({ k: 'dust', x: this.ox + c * this.cs, y: this.oy + this.floorRow(c) * this.cs - 2, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 50, life: 3 + Math.random() * 3, s: 1 + Math.random() * 2.5 }); }
      if (kind === 'food') this.parts.push({ k: 'food', x: this.ox + Math.random() * this.TW, y: this.oy + 2, vx: 0, vy: 10 + Math.random() * 14, life: 5, s: 1.6 });
    }
  }
  meltParticles(p) {
    const P = PLANTS[p.id];
    for (let i = 0; i < 2; i++) this.parts.push({ k: 'melt', x: this.ox + (p.c + Math.random() * P.w) * this.cs, y: this.oy + (p.r + Math.random() * P.h) * this.cs, vx: (Math.random() - 0.5) * 6, vy: 6 + Math.random() * 6, life: 2.5, s: 1.2 + Math.random() * 1.5 });
  }
  updateParts(dt) {
    for (const b of this.bubbles) { b.y -= b.vy * dt; b.w += dt * 5; }
    this.bubbles = this.bubbles.filter(b => b.y > this.oy + 1);
    for (const p of this.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.k === 'dust') { p.vy += 12 * dt; p.vx *= 0.98; } if (p.k === 'puff') { p.vx *= 0.9; p.vy *= 0.9; } }
    this.parts = this.parts.filter(p => p.life > 0 && p.y < this.oy + this.TH);
    if (this.bubbles.length > 260) this.bubbles.splice(0, this.bubbles.length - 260);
  }

  // ── 描画 ──
  frame(dt) {
    dt = Math.min(dt, CONFIG.MAX_DT);
    this.t += dt;
    if (this.layout) { this.updateFish(dt); this.spawnBubbles(dt); this.updateParts(dt); }
    this.draw();
  }
  draw() {
    const g = this.ctx, L = this.layout;
    g.clearRect(0, 0, this.w, this.h);
    if (!L) return;
    const { cs, ox, oy, TW, TH } = this;
    g.save();
    if (this.shake > 0) { g.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake); this.shake = Math.max(0, this.shake - 0.5); }
    this.drawRoom(g);
    // 水
    const lampI = (SIMCFG.LAMP[this.lamp] || 0) * this.lightMul;
    const wg = g.createLinearGradient(0, oy, 0, oy + TH);
    wg.addColorStop(0, `rgb(${18 + lampI * 20},${70 + lampI * 50},${92 + lampI * 50})`);
    wg.addColorStop(0.55, `rgb(${8 + lampI * 8},${36 + lampI * 22},${54 + lampI * 22})`);
    wg.addColorStop(1, '#03141d');
    g.fillStyle = wg; g.fillRect(ox, oy, TW, TH);
    g.save(); g.beginPath(); g.rect(ox, oy, TW, TH); g.clip();
    this.drawRays(g, lampI);
    this.drawCaustics(g, lampI);
    this.drawSubstrate(g);
    this.drawPlants(g);
    this.drawShade(g);
    this.drawFilterPipe(g);
    this.drawFish(g);
    this.drawBubbles(g);
    this.drawParts(g);
    this.drawWaterTint(g);
    if (this.showGrid) this.drawGrid(g);
    if (this.hover) this.drawHover(g);
    g.restore();
    this.drawGlass(g, lampI);
    g.restore();
  }
  drawRoom(g) {
    const { ox, oy, TW, TH, cs } = this;
    // 照明器具
    const on = this.lightMul > 0 && this.lamp > 0;
    const lampI = on ? SIMCFG.LAMP[this.lamp] : 0;
    g.fillStyle = '#0d1820'; g.fillRect(ox - 4, oy - 14, TW + 8, 8);
    if (this.mode === 'observe') {
      const k = clamp(this.lidT == null ? 1 : (this.t - this.lidT) / 0.5, 0, 1), w = (TW + 12) * (1 - Math.pow(1 - k, 3));
      g.fillStyle = '#1b2a33'; g.fillRect(ox - 6, oy - 20, w, 6);
      g.fillStyle = 'rgba(255,90,110,.85)'; for (let x = ox + 6; x < ox - 6 + w - 4; x += 48) g.fillRect(x, oy - 18, 2, 2);
    }
    if (on) {
      const lg = g.createLinearGradient(0, oy - 8, 0, oy + 30);
      lg.addColorStop(0, `rgba(220,245,255,${0.55 * lampI})`); lg.addColorStop(1, 'rgba(220,245,255,0)');
      g.fillStyle = lg; g.fillRect(ox, oy - 7, TW, 37);
      g.fillStyle = `rgba(235,250,255,${0.5 + lampI * 0.5})`; g.fillRect(ox + 4, oy - 8, TW - 8, 2);
    }
    // 台座
    g.fillStyle = '#0a1117'; g.fillRect(ox - 8, oy + TH + 2, TW + 16, 6);
  }
  drawRays(g, lampI) {
    if (lampI <= 0) return;
    const { ox, oy, TW, TH } = this;
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const r of this.rays) {
      const x = ox + ((r.x + Math.sin(this.t * r.sp + r.ph) * 0.08) % 1) * TW;
      const w = r.w * TW, sk = TH * 0.35;
      const gr = g.createLinearGradient(0, oy, 0, oy + TH);
      gr.addColorStop(0, `rgba(170,230,255,${0.07 * lampI})`); gr.addColorStop(1, 'rgba(170,230,255,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(x, oy); g.lineTo(x + w, oy); g.lineTo(x + w + sk, oy + TH); g.lineTo(x + sk, oy + TH); g.closePath(); g.fill();
    }
    g.restore();
  }
  drawCaustics(g, lampI) {
    if (lampI <= 0 || (Save.data && Save.data.settings.reduce)) return;
    const { ox, oy, TW, cs } = this;
    g.save(); g.strokeStyle = `rgba(190,240,255,${0.07 * lampI})`; g.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      g.beginPath();
      const y0 = oy + 6 + i * cs * 0.55;
      for (let x = 0; x <= TW; x += 8) { const y = y0 + Math.sin(x * 0.045 + this.t * 1.2 + i * 1.7) * 3 + Math.sin(x * 0.11 - this.t * 0.8) * 1.5; x === 0 ? g.moveTo(ox + x, y) : g.lineTo(ox + x, y); }
      g.stroke();
    }
    g.restore();
  }
  drawSubstrate(g) {
    const L = this.layout, { cs, ox, oy } = this;
    for (let r = 0; r < L.H; r++) for (let c = 0; c < L.W; c++) {
      const cell = L.cells[r][c]; if (!cell || cell.t !== 'sub') continue;
      const pk = this.popK(c, r), sz = cs * (0.55 + 0.45 * pk), x = ox + c * cs + (cs - sz) / 2, y = oy + r * cs + (cs - sz) / 2, im = IMG[cell.id];
      if (im) { const o = ((c * 37 + r * 13) % 24); g.drawImage(im, 12 + o * 0.5, 12 + ((c * 11 + r * 29) % 20) * 0.5, 92, 92, x, y, sz + 0.5, sz + 0.5); }
      else { g.fillStyle = '#4a3020'; g.fillRect(x, y, cs, cs); }
      const top = r === 0 || !(L.cells[r - 1][c] && L.cells[r - 1][c].t === 'sub');
      if (top) { g.fillStyle = 'rgba(255,240,210,.14)'; g.fillRect(x, y, cs, 2); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x, y + 2, cs, 1); }
      else { g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(x, y, cs, cs); }
    }
  }
  plantState(pl) {   // 観測中は sim の成長量、セットアップでは固定サイズ
    if (!this.sim) return { g: 0.82, melt: 0, alpha: 1 };
    const p = this.sim.plants.find(q => q.c === pl.c && q.r === pl.r);
    if (!p) return { g: 0.82, melt: 0, alpha: 1 };
    const P = PLANTS[p.id];
    const g0 = 0.55 + 0.55 * clamp((p.b - 0.5) / (P.bmax - 0.5), 0, 1);
    let v = this.plantVis.get(p.i); if (!v) { v = { g: g0, b0: 0 }; this.plantVis.set(p.i, v); }
    v.g += (g0 - v.g) * 0.08;
    if (p.melting && !v.b0) v.b0 = Math.max(0.4, p.b + 0.01);
    const melt = p.gone ? 1 : (v.b0 ? clamp(1 - p.b / v.b0, 0, 1) * 0.7 + 0.3 : 0);

  }
  drawPlants(g) {
    const L = this.layout, { cs, ox, oy } = this;
    for (const pl of SIM.listPlants(L)) {
      const P = PLANTS[pl.id], im = IMG[pl.id]; if (!im) continue;
      const st = this.plantState(pl); if (st.alpha <= 0.01) continue;
      st.g *= 0.4 + 0.6 * this.popK(pl.c, pl.r);

      if (P.kind === 'float') { size = cs * 1.2 * (0.8 + 0.25 * st.g); baseY = oy - cs * 0.15 + size; }
      else { size = Math.max(P.w, P.h) * cs * 1.18 * st.g; baseY = oy + (pl.r + P.h) * cs + cs * 0.1; }
      const sway = Math.sin(this.t * 0.9 + pl.c * 1.3) * (P.kind === 'stem' ? 0.045 : 0.018) * (1 - st.melt);
      g.save(); g.translate(cx, baseY); g.rotate(sway);
      const dw = size * (P.w > P.h ? 1.25 : 1), dh = size;
      g.globalAlpha = st.alpha * (1 - st.melt);
      g.drawImage(im, -dw / 2, -dh, dw, dh);
      if (st.melt > 0 && IMGX[pl.id]) { g.globalAlpha = st.alpha * st.melt; g.drawImage(IMGX[pl.id], -dw / 2, -dh * (1 - st.melt * 0.25), dw, dh * (1 - st.melt * 0.25)); }
      g.restore();
      if (st.p && st.p.melting && !st.p.gone && Math.random() < 0.15) this.meltParticles(st.p);
    }
  }
  drawShade(g) {
    // 暗い場所ほど影を落とす(浮草の真下・深い段が一目で分かるように)
    const L = this.layout, { cs, ox, oy } = this;
    if (!this.light) return;
    for (let r = 0; r < L.H; r++) for (let c = 0; c < L.W; c++) {
      const cell = L.cells[r][c]; if (cell && cell.t === 'sub') continue;
      const lv = this.light[r][c] * this.lightMul;
      const a = clamp(1 - lv / 0.9, 0, 1) * 0.5;
      if (a > 0.02) { g.fillStyle = `rgba(0,6,12,${a})`; g.fillRect(ox + c * cs, oy + r * cs, cs, cs); }
    }
  }
  drawFilterPipe(g) {
    if (this.filter === 'none') return;
    const { ox, oy, TW, TH, cs } = this;
    g.fillStyle = 'rgba(160,210,230,.18)'; g.fillRect(ox + TW - 9, oy - 2, 4, TH - cs * 0.5);
    g.fillStyle = this.powerOn ? 'rgba(82,255,170,.8)' : 'rgba(255,90,110,.9)'; g.fillRect(ox + TW - 9, oy + 4, 4, 3);
  }
  drawFish(g) {
    const { cs, ox, oy } = this;
    const list = [...this.fish].sort((a, b) => (SPECIES[a.id].zone === 'bottom') - (SPECIES[b.id].zone === 'bottom'));
    for (const f of list) {
      const sp = SPECIES[f.id]; const im = (!f.alive || f.sick > 0.55) && IMGX[f.id] ? IMGX[f.id] : IMG[f.id]; if (!im) continue;
      const size = cs * sp.size * 1.32;
      const bob = f.alive ? Math.sin(this.t * 2.2 + f.ph) * cs * 0.035 : 0;
      const x = ox + f.x * cs, y = oy + f.y * cs + bob;
      g.save(); g.translate(x, y);
      if (!f.alive) { g.globalAlpha = clamp(1 - (f.deadT - 5) / 4, 0, 1) * 0.85; g.scale(f.face, -1); g.rotate(0.15); }
      else {
        g.scale(-f.face, 1);   // 素材は左向き。右へ泳ぐときだけ反転する
        if (f.sick > 0) g.rotate(Math.sin(this.t * 3 + f.ph) * 0.18 * f.sick + 0.12 * f.sick);
        if (f.sick > 0.2 && f.sick <= 0.55) { g.globalAlpha = 1; }
      }
      g.drawImage(im, -size / 2, -size / 2, size, size);
      g.restore();
    }
  }
  drawBubbles(g) {
    g.save();
    for (const b of this.bubbles) {
      const x = b.x + Math.sin(b.w) * 1.5;
      g.strokeStyle = b.o2 ? 'rgba(210,255,230,.55)' : 'rgba(200,240,255,.5)'; g.lineWidth = 0.8;
      g.beginPath(); g.arc(x, b.y, b.r, 0, 6.283); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x - b.r * 0.4, b.y - b.r * 0.5, 1, 1);
    }
    g.restore();
  }
  drawParts(g) {
    for (const p of this.parts) {
      g.globalAlpha = p.k === 'puff' ? clamp(p.life / 0.5, 0, 1) * 0.7 : clamp(p.life / 1.5, 0, 1) * 0.8;
      g.fillStyle = p.k === 'puff' ? p.col : p.k === 'melt' ? '#7a5a2a' : p.k === 'food' ? '#d9a35a' : '#8a7458';
      g.fillRect(p.x, p.y, p.s, p.s);
    }
    g.globalAlpha = 1;
  }
  drawWaterTint(g) {
    const { ox, oy, TW, TH } = this;
    const s = this.sim;
    if (s) {
      const h = s.history.length ? s.history[s.history.length - 1] : null;
      if (h) {
        const a = clamp(h.a / 14, 0, 1) * 0.24, n = clamp(h.n / 14, 0, 1) * 0.22, t = clamp((h.t - 35) / 60, 0, 1) * 0.12;
        if (a > 0.01) { g.fillStyle = `rgba(200,239,76,${a})`; g.fillRect(ox, oy, TW, TH); }
        if (n > 0.01) { g.fillStyle = `rgba(150,80,150,${n})`; g.fillRect(ox, oy, TW, TH); }
        if (t > 0.01) { g.fillStyle = `rgba(150,170,60,${t})`; g.fillRect(ox, oy, TW, TH); }
      }
      // コケ: ガラス面の緑の斑点
      const alg = s.algae || 0;
      if (alg > 0.5) {
        g.fillStyle = `rgba(60,170,70,${alg / 100 * 0.28})`; g.fillRect(ox, oy, TW, TH);
        const n2 = Math.floor(alg / 100 * this.specks.length);
        for (let i = 0; i < n2; i++) { const sp = this.specks[i]; g.fillStyle = `rgba(90,200,90,${sp.a * clamp(alg / 60, 0.3, 1)})`; g.beginPath(); g.arc(ox + sp.x * TW, oy + Math.pow(sp.y, 0.8) * TH, sp.s * (0.6 + alg / 120), 0, 6.283); g.fill(); }
      }
    }
    if (this.lightMul <= 0) { g.fillStyle = 'rgba(0,4,10,.55)'; g.fillRect(ox, oy, TW, TH); }
    if (this.fx.heat) { g.fillStyle = `rgba(255,110,40,${0.06 + Math.sin(this.t * 3) * 0.03})`; g.fillRect(ox, oy, TW, TH); }
    if (this.fx.cold) { g.fillStyle = 'rgba(120,180,255,.09)'; g.fillRect(ox, oy, TW, TH); }
    if (this.flash) { g.fillStyle = this.flash.c; g.globalAlpha = this.flash.a; g.fillRect(ox, oy, TW, TH); g.globalAlpha = 1; this.flash.a -= 0.03; if (this.flash.a <= 0) this.flash = null; }
  }
  drawGrid(g) {
    const L = this.layout, { cs, ox, oy, TW, TH } = this;
    g.strokeStyle = 'rgba(120,215,255,.1)'; g.lineWidth = 1; g.beginPath();
    for (let c = 1; c < L.W; c++) { g.moveTo(ox + c * cs + 0.5, oy); g.lineTo(ox + c * cs + 0.5, oy + TH); }
    for (let r = 1; r < L.H; r++) { g.moveTo(ox, oy + r * cs + 0.5); g.lineTo(ox + TW, oy + r * cs + 0.5); }
    g.stroke();
    // 底床を置ける最上段の目安
    if (this.maxSubRows) { const y = oy + (L.H - this.maxSubRows) * cs; g.strokeStyle = 'rgba(255,197,77,.25)'; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(ox, y + 0.5); g.lineTo(ox + TW, y + 0.5); g.stroke(); g.setLineDash([]); }
  }
  drawHover(g) {
    const h = this.hover, { cs, ox, oy } = this;
    const col = h.ok ? 'rgba(82,255,170,' : 'rgba(255,90,110,';
    for (const [c, r] of h.cells) {
      if (c < 0 || r < 0 || c >= this.layout.W || r >= this.layout.H) continue;
      g.fillStyle = col + '.14)'; g.fillRect(ox + c * cs, oy + r * cs, cs, cs);
      g.strokeStyle = col + '.85)'; g.lineWidth = 1.5; g.setLineDash([4, 3]); g.strokeRect(ox + c * cs + 1, oy + r * cs + 1, cs - 2, cs - 2); g.setLineDash([]);
    }
    if (h.ok && h.id && IMG[h.id] && h.kind === 'plant') {
      const P = PLANTS[h.id]; const [c, r] = h.at;
      g.globalAlpha = 0.6;
      const cx = ox + (c + P.w / 2) * cs;
      if (P.kind === 'float') { const s = cs * 1.0; g.drawImage(IMG[h.id], cx - s / 2, oy - cs * 0.15, s, s); }
      else { const s = Math.max(P.w, P.h) * cs * 1.0; const dw = s * (P.w > P.h ? 1.25 : 1); g.drawImage(IMG[h.id], cx - dw / 2, oy + (r + P.h) * cs - s + cs * 0.1, dw, s); }
      g.globalAlpha = 1;
    }
    if (h.ok && h.kind === 'sub' && IMG[h.id]) { const [c, r] = h.at; g.globalAlpha = 0.55; g.drawImage(IMG[h.id], 12, 12, 92, 92, ox + c * cs, oy + r * cs, cs, cs); g.globalAlpha = 1; }
  }
  drawGlass(g, lampI) {
    const { ox, oy, TW, TH } = this;
    // 水面のゆらぎ
    g.strokeStyle = `rgba(200,245,255,${0.35 + lampI * 0.25})`; g.lineWidth = 1.2; g.beginPath();
    for (let x = 0; x <= TW; x += 6) { const y = oy + Math.sin(x * 0.07 + this.t * 2) * 0.8; x === 0 ? g.moveTo(ox + x, y) : g.lineTo(ox + x, y); }
    g.stroke();
    // ガラス枠と映り込み
    g.strokeStyle = 'rgba(150,220,255,.38)'; g.lineWidth = 2; g.strokeRect(ox - 1, oy - 1, TW + 2, TH + 2);
    const rg = g.createLinearGradient(ox, oy, ox + TW * 0.5, oy + TH);
    rg.addColorStop(0, 'rgba(255,255,255,.06)'); rg.addColorStop(0.35, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(ox, oy, TW, TH);
  }
}

// ===== 進行・解放の判定 =====
const Prog = {
  stageIndex(id) { return STAGES.findIndex(s => s.id === id); },
  cleared(id) { const r = Save.data.stages[id]; return !!(r && r.stars[0]); },
  unlocked(id) { const i = this.stageIndex(id); return i <= 0 || this.cleared(STAGES[i - 1].id); },
  chapterUnlocked(ch) { const first = STAGES.find(s => s.ch === ch); return first && this.unlocked(first.id); },
  totalStars() { let n = 0; for (const s of STAGES) { const r = Save.data.stages[s.id]; if (r) n += r.stars.filter(Boolean).length; } return n; },
  nextStage() { for (const s of STAGES) if (!this.cleared(s.id) && this.unlocked(s.id)) return s; return STAGES[STAGES.length - 1]; },
  labUnlocked() { return this.cleared('1-6'); },
  markSeen(ids) { let ch = false; for (const id of ids) if (!Save.data.seen[id]) { Save.data.seen[id] = 1; ch = true; } if (ch) Save.persist(); },
};
const ITEM_KIND = id => SPECIES[id] ? 'cre' : PLANTS[id] ? 'plant' : SUBSTRATES[id] ? 'sub' : id === 'bottle' ? 'equip' : null;
const itemName = id => t('it_' + id);

// 目標・星条件の文章
function goalText(st) {
  const g = st.goal;
  if (g.species) return t('goal_species', { name: itemName(g.species), n: g.min, d: st.days });
  if (g.kind === 'fish') return t('goal_fish', { n: g.min, d: st.days });
  return t('goal_any', { n: g.min, d: st.days });
}
function condText(c) {
  switch (c.t) {
    case 'noDeath': return t('c_nodeath');
    case 'algae': return t('c_algae', { v: c.max });
    case 'nh3': return t('c_nh3', { v: c.max });
    case 'no2': return t('c_no2', { v: c.max });
    case 'plantsMax': return t('c_plants', { v: c.max });
    case 'alive': return c.species ? t('c_alive_sp', { name: itemName(c.species), n: c.min }) : t('c_alive_fish', { n: c.min });
    case 'biomass': return t('c_biomass', { v: c.min });
    case 'species': return t('c_species', { v: c.min });
    case 'loadMin': return t('c_load', { v: c.min });

}
function newItemsOf(st) {   // その面で初登場する在庫
  const i = Prog.stageIndex(st.id), before = new Set();
  for (let k = 0; k < i; k++) Object.keys(STAGES[k].inv).forEach(x => before.add(x));

}

// ===== SETUP =====
const Setup = (() => {
  let st = null, isLab = false, L = null, cre = [], lamp = 2, filter = 'sponge', co2 = false, bottles = 0;
  let tool = null, erase = false, tab = 'cre', undo = [], tv = null, raf = 0, last = 0, drag = null, press = null;
  const TABS = [['cre', 'tab_cre'], ['plant', 'tab_plant'], ['sub', 'tab_sub'], ['equip', 'tab_equip']];

  const snap = () => JSON.stringify({ c: L.cells, cre: cre.map(c => c.id), lamp, filter, co2, bottles });
  function pushUndo() { undo.push(snap()); if (undo.length > 60) undo.shift(); }
  function restore(js) { const o = JSON.parse(js); L.cells = o.c; cre = o.cre.map(id => ({ id })); lamp = o.lamp; filter = o.filter; co2 = o.co2; bottles = o.bottles || 0; changed(); }
  function used(id) {
    if (SPECIES[id]) return cre.filter(c => c.id === id).length;
    if (id === 'bottle') return bottles;
    let n = 0;
    for (let r = 0; r < L.H; r++) for (let c = 0; c < L.W; c++) { const x = L.cells[r][c]; if (!x || x.id !== id) continue; if (x.t === 'sub') n++; else if (x.ox === c && x.oy === r) n++; }
    return n;
  }
  const left = id => (st.inv[id] || 0) - used(id);
  const load = () => cre.reduce((a, c) => a + SPECIES[c.id].load, 0);
  function setupObj() { return { layout: L, creatures: cre.map(c => ({ id: c.id, x: 0, y: 0 })), lamp, filter, co2, bottles, kBase: 0 }; }
  function goalReach() {   // 密閉時点で目標数に届いているか
    const g = st.goal;
    const n = cre.filter(c => g.species ? c.id === g.species : g.kind === 'fish' ? SPECIES[c.id].kind === 'fish' : true).length;
    return n >= g.min;
  }

  // ── 配置 ──
  function snapSub(c, r) {
    if (c < 0 || c >= L.W) return null;
    if (drag && drag.row != null) { const rr = drag.row; return SIM.canPlaceSub(L, st.maxSubRows, c, rr) === null ? [c, rr] : null; }
    if (r >= 0 && r < L.H && SIM.canPlaceSub(L, st.maxSubRows, c, r) === null) return [c, r];
    const fr = tv.floorRow(c); const rr = fr - 1;
    return rr >= 0 && SIM.canPlaceSub(L, st.maxSubRows, c, rr) === null ? [c, rr] : null;
  }
  function snapPlant(id, c, r) {
    const P = PLANTS[id];
    if (c < 0 || c + P.w > L.W) return null;
    if (P.kind === 'float') return SIM.canPlacePlant(L, id, c, 0) === null ? [c, 0] : null;
    if (r >= 0 && SIM.canPlacePlant(L, id, c, r - P.h + 1) === null) return [c, r - P.h + 1];
    if (r >= 0 && SIM.canPlacePlant(L, id, c, r) === null) return [c, r];
    const fr = tv.floorRow(c); const rr = fr - P.h;
    return rr >= 0 && SIM.canPlacePlant(L, id, c, rr) === null ? [c, rr] : null;
  }
  function reasonAt(id, c, r) {
    if (left(id) <= 0) return t('r_none');
    if (SUBSTRATES[id]) { const rr = clamp(r, 0, L.H - 1); const why = SIM.canPlaceSub(L, st.maxSubRows, c, rr); return t('r_' + (why || 'occupied')); }
    const P = PLANTS[id];
    if (P.kind === 'float') return c >= 0 && c < L.W && L.cells[0][c] ? t('r_occupied') : t('r_floatTop');
    const fr = tv.floorRow(c);
    const why = SIM.canPlacePlant(L, id, c, Math.max(0, fr - P.h));
    return t('r_' + (why || 'occupied'));
  }
  function place(c, r) {
    const id = tool; if (!id) return false;
    if (left(id) <= 0) { if (!drag || !drag.warned) { toast(t('r_none')); AU.se('ng', 0.7); } if (drag) drag.warned = true; return false; }
    if (SUBSTRATES[id]) {
      const at = snapSub(c, r); if (!at) return false;
      L.cells[at[1]][at[0]] = { t: 'sub', id };
      tv.pop(at[0], at[1]); tv.puff(at[0], at[1], id === 'gravel' ? '#b8ad98' : '#6b4a2e');
      if (drag && drag.row == null) drag.row = at[1];
    } else {
      const at = snapPlant(id, c, r);
      if (!at) { toast('✗ ' + reasonAt(id, c, r)); AU.se('ng', 0.6); return false; }
      SIM.placePlant(L, id, at[0], at[1]);
      tv.pop(at[0], at[1]); tv.puff(at[0] + (PLANTS[id].w - 1) / 2, at[1] + PLANTS[id].h - 0.5, '#7fdc8f');
    }
    AU.se('ok', 0.55, 0.95 + Math.random() * 0.1);
    changed(); return true;
  }
  function removeAt(c, r) {
    if (c < 0 || r < 0 || c >= L.W || r >= L.H) return false;
    const x = L.cells[r][c];
    if (!x) return false;
    tv.puff(c, r, 'rgba(200,230,255,.8)');
    if (x.t === 'plant') { clearPlant(x); }
    else {
      // 底床を抜くと、その上に載っていた底床と植物も一緒に回収する
      for (let rr = r; rr >= 0; rr--) {
        const y = L.cells[rr][c]; if (!y) break;
        if (y.t === 'plant') { if (PLANTS[y.id].kind !== 'float') clearPlant(y); break; }
        L.cells[rr][c] = null;
      }
      // 隣の列にまたがる植物(バリスネリア)も支えを失えば回収
      for (const pl of SIM.listPlants(L)) { const P = PLANTS[pl.id]; if (P.kind === 'float') continue; const b = pl.r + P.h; for (let dc = 0; dc < P.w; dc++) { const y = b < L.H ? L.cells[b][pl.c + dc] : null; if (!y || y.t !== 'sub') { clearPlant(L.cells[pl.r][pl.c]); break; } } }
    }

  function clearPlant(x) {

    for (let dr = 0; dr < P.h; dr++) for (let dc = 0; dc < P.w; dc++) {
      const row = L.cells[oy + dr], y = row && row[ox + dc];

  // ── ポインタ操作(マウス: 左=置く/右=撤去、タッチ: タップ=置く/長押し=撤去) ──
  function local(e) {
    const r = tv.cv.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * tv.w, py = (e.clientY - r.top) / r.height * tv.h;
    return { px, py, ...tv.cellAt(px, py) };
  }
  function updateHover(p) {
    if (erase) { tv.hover = p.c >= 0 && p.r >= 0 && p.c < L.W && p.r < L.H && L.cells[p.r][p.c] ? { ok: false, cells: [[p.c, p.r]] } : null; return; }
    if (!tool || p.c < 0 || p.c >= L.W) { tv.hover = null; return; }
    if (SUBSTRATES[tool]) { const at = left(tool) > 0 ? snapSub(p.c, p.r) : null; tv.hover = at ? { ok: true, kind: 'sub', id: tool, at, cells: [at] } : { ok: false, cells: [[p.c, clamp(p.r, 0, L.H - 1)]] }; return; }
    const P = PLANTS[tool]; const at = left(tool) > 0 ? snapPlant(tool, p.c, p.r) : null;
    if (at) { const cells = []; for (let dr = 0; dr < P.h; dr++) for (let dc = 0; dc < P.w; dc++) cells.push([at[0] + dc, at[1] + dr]); tv.hover = { ok: true, kind: 'plant', id: tool, at, cells }; }
    else tv.hover = { ok: false, cells: [[p.c, clamp(p.r, 0, L.H - 1)]] };
  }
  function bindCanvas() {
    const cv = $('setup-tank');
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('pointerdown', e => {
      e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 一部ブラウザ・合成イベントでは捕捉できないが操作は続行できる */ }
      const p = local(e);
      if (e.button === 2 || erase) { pushUndo(); if (!removeAt(p.c, p.r)) undo.pop(); return; }
      if (e.pointerType !== 'mouse') {
        // タッチは指を離した時に置く。長押しは撤去、横に動かせば底床の連続配置
        press = { x: e.clientX, y: e.clientY, p, fired: false, timer: setTimeout(() => { press.fired = true; pushUndo(); if (!removeAt(p.c, p.r)) undo.pop(); else toast(t('removed'), true); }, 480) };
        updateHover(p); return;
      }
      if (!tool) { const x = p.c >= 0 && p.r >= 0 && p.c < L.W && p.r < L.H && L.cells[p.r][p.c]; if (!x) toast(t('pick_first')); return; }
      pushUndo(); drag = { row: null, any: false };
      if (place(p.c, p.r)) drag.any = true;
      updateHover(p);
    });
    cv.addEventListener('pointermove', e => {
      const p = local(e);
      if (press && !press.fired && !drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) {
        clearTimeout(press.timer);
        if (tool && SUBSTRATES[tool]) { pushUndo(); drag = { row: null, any: false }; if (place(press.p.c, press.p.r)) drag.any = true; }
        else press = null;
      }
      if (drag && tool && SUBSTRATES[tool] && (e.pointerType !== 'mouse' || (e.buttons & 1))) { if (place(p.c, p.r)) drag.any = true; }
      updateHover(p);
      if (e.pointerType === 'mouse' && tv.hover && !tv.hover.ok && tool) tipShow(esc(reasonAt(tool, p.c, p.r)), e.clientX, e.clientY); else tipHide();
    });
    const end = e => {
      if (press) {
        clearTimeout(press.timer);
        if (!press.fired && !drag && e && e.type === 'pointerup') {
          if (tool) { pushUndo(); if (!place(press.p.c, press.p.r)) undo.pop(); }
          else { const q = press.p, x = q.c >= 0 && q.r >= 0 && q.c < L.W && q.r < L.H && L.cells[q.r][q.c]; if (!x) toast(t('pick_first')); }
        }
        press = null;
        if (e && e.pointerType !== 'mouse') tv.hover = null;
      }
      if (drag && !drag.any) undo.pop();
      drag = null;
    };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', () => { tv.hover = null; tipHide(); });
  }

  // 設計診断: 予測ではなく「立ち上げ初期」と「長期のつり合い」の目安だけを見せる
  function diagnose() {
    const S = setupObj(); const a = SIM.analyze(L, S);
    const probe = SIM.create({ ...st, days: 26, goal: { min: 0 }, events: [] }, S);
    while (!probe.ended) SIM.step(probe);
    // 途中で回復した個体も「最も弱った瞬間」で評価する
    let minHp = 100;
    for (const c of probe.creatures) minHp = Math.min(minHp, c.alive ? c.minHp : 0);
    const early = minHp;
    const eL = !cre.length ? 0 : minHp >= 85 ? 0 : minHp >= 55 ? 1 : minHp >= 25 ? 2 : 3;
    let mature = 0;
    for (const pl of SIM.listPlants(L)) { const P = PLANTS[pl.id]; const lf = SIM.lightFactor(P, a.light[pl.r][pl.c]); mature += P.absorb * P.bmax * (0.25 + 0.75 * lf) * (co2 ? 1.25 : 1) * (P.life > 0 && P.life * (co2 ? 0.8 : 1) < st.days ? 0.6 : 1); }
    const bal = a.waste > 0 ? mature / a.waste : 9;
    const bL = bal >= 1.3 ? 0 : bal >= 0.95 ? 1 : bal >= 0.6 ? 2 : 3;
    const algaeP = Math.pow(a.meanLight, 2) * Math.max(0, 1.4 - bal) * (st.days / 60) - a.clean * 0.15;
    const gL = algaeP < 0.12 ? 0 : algaeP < 0.3 ? 1 : algaeP < 0.55 ? 2 : 3;
    return { a, eL, bL, gL, mature, early };
  }

  async function seal() {
    if (!goalReach()) { toast('✗ ' + t('seal_need', { g: goalText(st) })); AU.se('ng', 0.7); return; }
    const r = isLab ? null : Save.data.stages[st.id];
    const n = isLab ? Save.data.lab.runs + 1 : ((r && r.attempts) || 0) + 1;
    const extra = Setup._diag && Setup._diag.eL >= 2 ? '\n\n' + t('seal_warn_risk') : '';
    const v = await modal('▣ SEAL HATCH', esc(t('seal_body', { d: st.days, n })) + (n === 1 && !isLab ? '\n<span style="color:var(--amber)">' + esc(t('seal_os')) + '</span>' : '') + esc(extra), [{ label: t('cancel'), v: 0, cls: 'ghost' }, { label: t('seal_go'), v: 1, cls: 'primary' }]);

  }

  let bound = false;

    window.addEventListener('keydown', e => {
      if (curScreen !== 'setup' || $('modal').classList.contains('on')) return;

  return {
    enter(arg) {

      const saved = isLab ? (arg.fresh ? null : Save.data.lab.layout) : Save.stage(st.id).layout;
      L = { W: st.W, H: st.H, cells: Array.from({ length: st.H }, () => new Array(st.W).fill(null)) };
      cre = []; lamp = st.lampChoice ? st.lampChoice[Math.floor((st.lampChoice.length - 1) / 2)] : st.lamp; filter = st.filterChoice ? st.filterChoice[0] : st.filter; co2 = false; bottles = 0;
      if (saved && saved.cells && saved.cells.length === st.H && saved.cells[0].length === st.W) {
        L.cells = saved.cells; cre = (saved.cre || []).filter(id => st.inv[id]).map(id => ({ id }));
        if (st.lampChoice && st.lampChoice.includes(saved.lamp)) lamp = saved.lamp;
        if (st.filterChoice && st.filterChoice.includes(saved.filter)) filter = saved.filter;
        co2 = !!(st.co2 && saved.co2); bottles = Math.min(saved.bottles || 0, st.inv.bottle || 0);
      }
      tool = null; erase = false; undo = []; tab = 'cre';
      if (!SIM.countSub(L).total) tab = Object.keys(st.inv).some(id => SUBSTRATES[id]) ? 'sub' : 'cre';
      if (!tv) tv = new TankView($('setup-tank'), 592, 432);
      tv.sim = null; tv.fish = []; tv.lightMul = 1; tv.powerOn = true; tv.mode = 'setup'; tv.fx = {}; tv.bubbles = []; tv.parts = [];
      tv.lamp = lamp; tv.filter = filter; tv.maxSubRows = st.maxSubRows; tv.showGrid = Save.data.settings.grid; tv.setLayout(L); tv.syncFish(cre);
      renderTabs(); renderTimeline('su-timeline', st.days, st.events); changed();
      last = 0; raf = requestAnimationFrame(loop);
      // バクテリアのいない最初の実験(1-2)で、仕組み図を一度だけ見せる
      if (!isLab && st.id === '1-2' && !Save.data.ach._how) { Save.data.ach._how = 1; Save.persist(); setTimeout(showHow, 450); }
    },
    leave() { cancelAnimationFrame(raf); tipHide(); },

// ===== OBSERVE =====
const Observe = (() => {
  let st, setup, s, tv, raf = 0, last = 0, acc = 0, speed = 1, paused = false, endT = 0, isLab = false, attempt = 1;
  let flags = {}, logs = [], fishMap = [], minTol = { a: 99, n: 99 }, finishing = false, startDelay = 0;

  function log(text, kind = '') {
    logs.unshift({ d: s.day, text, kind }); if (logs.length > 7) logs.pop();
    $('obs-log').innerHTML = logs.map(l => `<div class="l ${l.kind}"><span class="d">D${String(l.d).padStart(3, '0')}</span>${esc(l.text)}</div>`).join('');
  }
  function banner(title, sub, color) {
    const b = $('obs-banner'); b.innerHTML = `${esc(title)}<small>${esc(sub)}</small>`; b.style.color = color; b.style.borderColor = color; b.classList.add('show');
    clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.remove('show'), 2600 / Math.sqrt(speed));
  }
  function meters() {
    const h = s.history.length ? s.history[s.history.length - 1] : { a: 0, n: 0, t: 0, g: 0, ba: s.bacA, bb: s.bacB, k: s.K };
    const row = (lbl, col, v, max, tick, txt) => `<div class="meter"><span class="ml" style="color:${col}">${lbl}</span><span class="mbar"><i style="width:${clamp(v / max, 0, 1) * 100}%;background:${col}"></i>${tick != null ? `<b style="left:${clamp(tick / max, 0, 1) * 100}%"></b>` : ''}</span><span class="mv" style="color:${col}">${txt}</span></div>`;
    $('ob-meters').innerHTML =
      row('NH₃ ' + t('m_nh3'), 'var(--nh3)', h.a, 20, minTol.a < 99 ? minTol.a : null, fmt1(h.a)) +
      row('NO₂ ' + t('m_no2'), 'var(--no2)', h.n, 20, minTol.n < 99 ? minTol.n : null, fmt1(h.n)) +
      row('NO₃ ' + t('m_no3'), 'var(--no3)', h.t, 100, SIMCFG.DMG_NO3_TH, Math.round(h.t)) +
      row(t('m_algae'), 'var(--algae)', h.g, 100, SIMCFG.ALGAE_O2_TH, Math.round(h.g) + '%') +
      `<div class="meter"><span class="ml" style="color:var(--green)">${t('m_bac')}</span><span style="display:flex;flex-direction:column;gap:2px"><span class="mbar" style="height:5px"><i style="width:${clamp(h.ba / (h.k || 1), 0, 1) * 100}%;background:var(--green)"></i></span><span class="mbar" style="height:5px"><i style="width:${clamp(h.bb / (h.k || 1), 0, 1) * 100}%;background:#2fbf86"></i></span></span><span class="mv" style="color:var(--green);font-size:10px">A/B</span></div>`;
  }
  function roster() {
    $('roster').classList.toggle('dense', s.creatures.length > 16);
    $('roster').innerHTML = s.creatures.map(c => `<div class="rc ${c.alive ? '' : 'dead'}" title="${esc(itemName(c.id))}">${iconTag(c.id)}<span class="hp"><i style="width:${c.hp}%;background:${c.hp > 60 ? 'var(--green)' : c.hp > 30 ? 'var(--amber)' : 'var(--red)'}"></i></span></div>`).join('');
    const g = SIM.goalCount(s);
    $('ob-alive').innerHTML = `${t('alive')} ${SIM.aliveCount(s)}/${s.creatures.length} · ${t('goal_short')} ${g}/${s.goal.min}`;
    $('ob-alive').style.color = g < s.goal.min ? 'var(--red)' : '';
  }
  function dayUI() {
    $('obs-day').querySelector('.n').textContent = String(s.day).padStart(3, '0');
    $('obs-day').querySelector('.of').textContent = `/ ${s.days} DAY`;
    const cur = $('ob-timeline').querySelector('.cur'); if (cur) cur.style.left = (s.day / s.days * 100) + '%';
  }
  function updateMinTol() {
    minTol = { a: 99, n: 99 };
    for (const c of s.creatures) if (c.alive) { minTol.a = Math.min(minTol.a, SPECIES[c.id].tolA * c.hardy); minTol.n = Math.min(minTol.n, SPECIES[c.id].tolN * c.hardy); }
  }

  // 1日進める: シミュレーション結果を演出と実況に変換する
  function stepDay() {
    const out = SIM.step(s);
    const h = s.history[s.history.length - 1];
    for (const e of out.eventsStarted) {
      banner(`${EVENT_DEFS[e.type].icon} ${t('ev_' + e.type)}`, t('evd_' + e.type), 'var(--amber)');
      log(t('n_event', { e: t('ev_' + e.type) }), 'bad'); AU.se('event', 0.7);
      if (e.type === 'quake') { tv.shake = Save.data.settings.reduce ? 0 : 14; tv.burst('dust', 60); }
      if (e.type === 'overfeed') tv.burst('food', 40);
      if (e.type === 'bloom') tv.flash = { c: 'rgba(80,220,90,1)', a: 0.35 };
    }
    // 継続中のイベントの見た目
    const act = SIM.activeEvents(s).map(e => e.type);
    tv.lightMul = act.includes('lightfail') ? 0 : 1; tv.powerOn = !act.includes('power');
    tv.fx.heat = act.includes('heat'); tv.fx.cold = act.includes('cold');
    for (const c of out.deaths) {
      const f = fishMap[c.i]; if (f) { f.alive = false; f.vx = 0; }
      if (!Save.data.settings.reduce) tv.flash = { c: 'rgba(255,60,80,1)', a: 0.12 };
      AU.synth('death');
      log(t('n_death', { n: itemName(c.id), c: t('cause_' + c.cause) }), 'bad');
      if (!flags.firstDeath) { flags.firstDeath = 1; setTimeout(() => log(t('n_decay'), 'bad'), 80); }
    }
    if (out.deaths.length) {
      flags.recent = (flags.recent || []).filter(d => s.day - d < 4).concat(out.deaths.map(() => s.day));
      if (flags.recent.length >= 4 && !flags.cascade) { flags.cascade = 1; log(t('n_cascade'), 'bad'); Ach.flag('cascade'); }
      updateMinTol();
    }
    for (const p of out.melts) {
      AU.synth('melt');
      log(t(p.meltCause === 'dark' ? 'n_melt_dark' : 'n_melt', { p: itemName(p.id) }), 'bad');
    }
    // 生体の弱り具合を見た目へ
    for (const c of s.creatures) { const f = fishMap[c.i]; if (f && c.alive) { f.sick = c.sick; f.hp = c.hp; } }
    // 状況の実況(1回ずつ)
    if (!flags.nh3 && h.a > minTol.a * 0.8 && minTol.a < 99) { flags.nh3 = 1; log(t('n_nh3'), 'bad'); AU.se('crit', 0.5); }
    if (!flags.no2 && h.n > minTol.n * 0.8 && minTol.n < 99) { flags.no2 = 1; log(t('n_no2'), 'bad'); }
    if (!flags.cycle && s.day > 10 && h.a < 0.6 && h.n < 0.6 && (flags.nh3 || flags.no2 || s.day > 18)) { flags.cycle = 1; log(t('n_cycle'), 'good'); }
    if (!flags.alg1 && h.g > 45) { flags.alg1 = 1; log(t('n_algae'), 'bad'); }
    if (!flags.alg2 && h.g > SIMCFG.ALGAE_O2_TH) { flags.alg2 = 1; log(t('n_o2'), 'bad'); }
    if (!flags.no3 && h.t > SIMCFG.DMG_NO3_TH * 0.85) { flags.no3 = 1; log(t('n_no3'), 'bad'); }
    if (!flags.half && s.day >= Math.floor(s.days / 2)) { flags.half = 1; log(t('n_half'), ''); }
    if (s.day % 5 === 0) AU.synth('tick');
    dayUI(); meters(); roster();
    if (s.ended) finish();
  }
  function finish() {
    if (finishing) return; finishing = true;
    endT = performance.now();
    const clear = s.endReason === 'clear';
    log(t(clear ? 'n_clear' : 'n_fail'), clear ? 'good' : 'bad');
    setTimeout(() => {
      const st2 = $('obs-stamp'); const el = st2.querySelector('.s');
      el.textContent = clear ? 'STABILIZED' : 'COLLAPSE'; el.style.color = clear ? 'var(--green)' : 'var(--red)';
      st2.classList.add('show'); AU.se(clear ? 'clear' : 'crit', 0.8);
      setTimeout(() => { st2.classList.remove('show'); Result.fromRun({ st, s, setup, attempt, isLab }); }, CONFIG.STAMP_HOLD_MS);
    }, CONFIG.END_HOLD_MS);
  }
  function loop(ts) {
    const dt = last ? (ts - last) / 1000 : 0; last = ts;
    if (startDelay > 0) startDelay -= Math.min(dt, CONFIG.MAX_DT);
    else if (!paused && !finishing) {
      acc += Math.min(dt, CONFIG.MAX_DT) * CONFIG.DAYS_PER_SEC[speed];
      let guard = 0;
      while (acc >= 1 && !s.ended && guard++ < 20) { acc -= 1; stepDay(); }
    }
    tv.frame(paused ? 0 : dt);
    raf = requestAnimationFrame(loop);
  }
  function speedUI() {
    const b = (k, label) => `<button class="${(k === 'p' && paused) || (k === speed && !paused) ? 'on' : ''}" data-sp="${k}">${label}</button>`;
    $('ob-speed').innerHTML = b('p', '❚❚') + b(1, '1×') + b(2, '2×') + b(4, '4×') + `<button data-sp="skip" title="${esc(t('skip_tip'))}">⏭</button>`;
    $('ob-speed').querySelectorAll('[data-sp]').forEach(x => x.onclick = () => {
      const k = x.dataset.sp; AU.se('click', 0.5);
      if (k === 'p') paused = !paused;
      else if (k === 'skip') { paused = false; let g = 0; while (!s.ended && g++ < 400) stepDay(); }
      else { paused = false; speed = +k; Save.data.settings.speed = speed; Save.persist(); }
      speedUI();
    });
  }
  function onVis() { if (document.hidden && curScreen === 'observe') { paused = true; speedUI(); } }
  document.addEventListener('visibilitychange', onVis);
  // キーボード: Space=一時停止 / 1・2・4=速度
  window.addEventListener('keydown', e => {
    if (curScreen !== 'observe' || finishing || $('modal').classList.contains('on')) return;
    if (e.key === ' ') { e.preventDefault(); paused = !paused; speedUI(); }
    else if (['1', '2', '4'].includes(e.key)) { paused = false; speed = +e.key; Save.data.settings.speed = speed; Save.persist(); speedUI(); }
  });
  return {
    enter(arg) {
      st = arg.stage; setup = arg.setup; attempt = arg.attempt; isLab = arg.isLab;
      s = SIM.create(st, setup);
      flags = {}; logs = []; acc = 0; paused = false; finishing = false; speed = Save.data.settings.speed || 1;
      AU.bgm('observe');
      if (!tv) tv = new TankView($('obs-tank'), 592, 432);
      tv.sim = s; tv.mode = 'observe'; tv.lamp = setup.lamp; tv.filter = setup.filter; tv.showGrid = false; tv.hover = null; tv.fx = {}; tv.lightMul = 1; tv.powerOn = true;
      tv.plantVis.clear(); tv.bubbles = []; tv.parts = []; tv.fish = []; tv.school = null;
      tv.setLayout(setup.layout);
      fishMap = s.creatures.map(c => tv.addFish(c.id, setup.creatures[c.i].x, setup.creatures[c.i].y));
      updateMinTol();
      $('ob-id').textContent = isLab ? 'FREE LAB' : `EXP ${st.id} · ${t('st_' + st.id)}`;
      $('ob-goal').innerHTML = `<span class="star on" style="width:11px;height:11px;vertical-align:-1px"></span> ${esc(goalText(st))}`;
      $('ob-hint').textContent = t('obs_hint');
      Setup.renderTimeline('ob-timeline', s.days, s.events, 0);
      $('obs-log').innerHTML = ''; log(t('n_seal'), '');
      tv.lidT = tv.t; startDelay = 1.1;
      banner('▣ HATCH SEALED', t('sealed_sub'), 'var(--red)');
      dayUI(); meters(); roster(); speedUI();
      last = 0; raf = requestAnimationFrame(loop);
    },
    leave() { cancelAnimationFrame(raf); $('obs-banner').classList.remove('show'); },
  };
})();
Screens.observe = Observe;

// ===== RESULT =====
const Result = (() => {
  let ctxData = null;
  // 死因分析: 履歴から「何が・いつ・なぜ」を具体的な数値で言語化する
  function autopsy(st, s, setup, j) {
    const out = [], a = SIM.analyze(setup.layout, setup);
    const dead = s.creatures.filter(c => !c.alive);
    const by = {}; dead.forEach(c => by[c.cause] = (by[c.cause] || 0) + 1);
    const can = id => !!st.inv[id];
    const canSub = can('gravel') || can('soil') || can('amazonia_soil');
    if (dead.length) out.push({ k: 'bad', tag: 'DEATH', text: t('ap_deaths', { n: dead.length, list: Object.entries(by).map(([k, v]) => t('cause_' + k) + '×' + v).join(' / ') }) });
    let tolA = 99, tolN = 99, tolNid = null;
    for (const c of setup.creatures) { const sp = SPECIES[c.id]; if (sp.tolA < tolA) tolA = sp.tolA; if (sp.tolN < tolN) { tolN = sp.tolN; tolNid = c.id; } }
    if (by.nh3 || (s.peak.nh3 > tolA && !j.clear)) {
      out.push({ k: 'bad', tag: 'NH₃', text: t('ap_nh3', { d: s.peak.nh3Day, v: fmt1(s.peak.nh3), tol: fmt1(tolA), w: fmt1(a.waste) }) });
      const fx = [t('fx_fewer')]; if (canSub) fx.push(t('fx_gravel')); if (st.inv.bottle && !setup.bottles) fx.push(t('fx_bottle')); if (Object.keys(st.inv).some(id => PLANTS[id])) fx.push(t('fx_plants_nh3'));
      out.push({ k: 'tip', tag: 'FIX', text: fx.join(' / ') });
    }
    if (by.no2 || (s.peak.no2 > tolN && !j.clear)) {
      out.push({ k: 'bad', tag: 'NO₂', text: t('ap_no2', { d: s.peak.no2Day, v: fmt1(s.peak.no2), tol: fmt1(tolN), sp: itemName(tolNid || 'fish_s') }) });
      if (!by.nh3) out.push({ k: 'tip', tag: 'FIX', text: [t('fx_fewer'), canSub ? t('fx_gravel') : '', st.inv.bottle && !setup.bottles ? t('fx_bottle') : ''].filter(Boolean).join(' / ') });
    }
    const plantsAvail = Object.keys(st.inv).some(id => PLANTS[id]);
    if (by.no3 || (plantsAvail && s.peak.no3 > SIMCFG.DMG_NO3_TH * 0.9)) out.push({ k: by.no3 ? 'bad' : 'warn', tag: 'NO₃', text: t('ap_no3', { v: Math.round(s.peak.no3), d: s.peak.no3Day }) });
    if (by.o2 || s.peak.algae > 50) out.push({ k: by.o2 ? 'bad' : 'warn', tag: 'ALGAE', text: t('ap_algae', { v: Math.round(s.peak.algae), lamp: t('lamp' + setup.lamp) }) });
    const darkMelt = s.plants.filter(p => p.meltCause === 'dark'), ageMelt = s.plants.filter(p => p.meltCause === 'age');
    if (darkMelt.length) out.push({ k: 'bad', tag: 'SHADE', text: t('ap_dark', { n: darkMelt.length }) });
    if (ageMelt.length) out.push({ k: 'warn', tag: 'LIFE', text: t('ap_age', { n: ageMelt.length }) });
    for (const e of s.events) {
      const inWin = dead.filter(c => c.deathDay >= e.day && c.deathDay <= e.day + (e.len || 1) + 6).length;
      if (inWin) out.push({ k: 'bad', tag: 'EVENT', text: t('ap_event', { e: t('ev_' + e.type), n: inWin }) });
    }
    if (!s.plants.length && Object.keys(st.inv).some(id => PLANTS[id])) out.push({ k: 'tip', tag: 'HINT', text: t('ap_noplants') });
    if (j.clear) {
      out.unshift({ k: 'good', tag: 'OK', text: t('ap_clear', { n: SIM.aliveCount(s), m: s.creatures.length }) });
      st.stars.forEach((c, i) => { if (!j.stars[i + 1]) out.push({ k: 'warn', tag: '★' + (i + 2), text: t('ap_miss', { c: condText(c), v: condValue(c, s) }) }); });
    }
    if (!out.length) out.push({ k: 'good', tag: 'OK', text: t('ap_none') });
    return out;
  }
  function condValue(c, s) {
    switch (c.t) {
      case 'algae': return Math.round(s.peak.algae) + '%';
      case 'nh3': return fmt1(s.peak.nh3);
      case 'no2': return fmt1(s.peak.no2);
      case 'noDeath': return t('deaths_n', { n: s.creatures.filter(x => !x.alive).length });
      case 'alive': return String(SIM.aliveCount(s, c.kind || (c.species ? null : 'fish'), c.species || null));
      case 'biomass': return fmt1(s.biomass || 0);
      case 'species': return String(new Set(s.creatures.filter(x => x.alive).map(x => x.id)).size);
    }
    return '';
  }
  function drawChart() {
    if (!ctxData) return;
    const { s } = ctxData, cv = $('res-chart');
    const W = 542, H = 226, dpr = Math.min(window.devicePixelRatio || 1, 2.5), k = Math.max(1, VIEW_SCALE * dpr);
    cv.width = W * k; cv.height = H * k; cv.style.width = W + 'px'; cv.style.height = H + 'px';

    for (let i = 0; i <= 4; i++) { const v = yMax * i / 4, y = Y(v); g.beginPath(); g.moveTo(pad.l, y + 0.5); g.lineTo(pad.l + pw, y + 0.5); g.stroke(); g.fillText(Math.round(v), 4, y + 3); g.fillText(Math.round(i * y2Max / 4) + '', pad.l + pw + 6, Y2(i * y2Max / 4) + 3); }
    for (let d = 0; d <= days; d += days >= 60 ? 20 : 10) { const x = X(Math.max(1, d)); g.fillText(String(d), x - 5, H - 5); }
    // 耐性ライン(最も弱い種)
    let tol = 99; for (const c of s.creatures) tol = Math.min(tol, SPECIES[c.id].tolA, SPECIES[c.id].tolN);
    if (tol < 99) { g.strokeStyle = 'rgba(255,90,110,.55)'; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(pad.l, Y(tol) + 0.5); g.lineTo(pad.l + pw, Y(tol) + 0.5); g.stroke(); g.setLineDash([]); g.fillStyle = 'rgba(255,90,110,.8)'; g.fillText('TOL ' + fmt1(tol), pad.l + 4, Y(tol) - 3); }
    const line = (key, col, yf, dash) => { g.strokeStyle = col; g.lineWidth = 1.8; if (dash) g.setLineDash(dash); g.beginPath(); hist.forEach((h, i) => { const x = X(h.d), y = yf(h[key]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.setLineDash([]); };
    line('t', '#4fb6ff', Y2); line('g', '#5fe07e', Y2, [3, 3]); line('n', '#c48bff', Y); line('a', '#c8ef4c', Y);
    // 死亡マーカー
    const dd = {}; s.creatures.filter(c => !c.alive).forEach(c => dd[c.deathDay] = (dd[c.deathDay] || 0) + 1);
    for (const [d, n] of Object.entries(dd)) { const x = X(+d); g.fillStyle = '#ff5a6e'; g.beginPath(); g.moveTo(x, pad.t + ph - 2); g.lineTo(x - 4, pad.t + ph + 6); g.lineTo(x + 4, pad.t + ph + 6); g.fill(); if (n > 1) { g.font = '9px sans-serif'; g.fillText('×' + n, x + 4, pad.t + ph - 2); } }
  }

      <div class="setrow"><div class="sl"><b>${t('s_reduce')}</b><span>${t('s_reduce_d')}</span></div>${seg('reduce', [[false, 'OFF'], [true, 'ON']], s.reduce)}</div>
      <div class="setrow"><div class="sl"><b>${t('s_lang')}</b><span>Language</span></div>${seg('lang', [['ja', '日本語'], ['en', 'ENGLISH']], Save.data.lang)}</div>
      <div class="setrow"><div class="sl"><b>${t('s_opening')}</b><span>${t('s_opening_d')}</span></div><button class="btn sm" id="set-op">▶ ${t('play')}</button></div>
      ${Prog.cleared('3-6') ? `<div class="setrow"><div class="sl"><b>${t('s_epilogue')}</b><span>${t('s_opening_d')}</span></div><button class="btn sm" id="set-ed">▶ ${t('play')}</button></div>` : ''}
      <div class="setrow"><div class="sl"><b style="color:var(--red)">${t('s_reset')}</b><span>${t('s_reset_d')}</span></div><button class="btn sm danger" id="set-reset">${t('s_reset')}</button></div>
      <div class="setrow" style="border:0"><div class="sl"><b>CREDITS</b><span>${esc(t('credits'))}</span></div></div>`;
    $('set-body').querySelectorAll('[data-r]').forEach(r => r.oninput = () => { s[r.dataset.r] = +r.value; AU.applyVol(); Save.persist(); });
    $('set-body').querySelectorAll('[data-r=se]').forEach(r => r.onchange = () => AU.se('ok', 1));
    $('set-body').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k, v = b.dataset.v; AU.se('click', 0.6);
      if (k === 'lang') { Save.data.lang = v; applyStaticText(); }
      else if (k === 'speed') s.speed = +v; else s[k] = v === 'true';
      Save.persist(); render();
    });
    $('set-op').onclick = () => go('opening');
    if ($('set-ed')) $('set-ed').onclick = () => go('opening', { ending: true });
    $('set-reset').onclick = async () => { const v = await modal(t('s_reset'), esc(t('s_reset_body')), [{ label: t('cancel'), v: 0, cls: 'ghost' }, { label: t('s_reset'), v: 1, cls: 'danger' }]); if (v) { const lang = Save.data.lang; Save.reset(); Save.data.lang = lang; Save.persist(true); AU.applyVol(); toast(t('s_reset_done'), true); render(); } };
  }
  return { enter() { AU.bgm('menu'); render(); } };
})();

// ===== OPENING =====
Screens.opening = (() => {
  let timers = [];
  function done() { timers.forEach(clearTimeout); timers = []; Save.data.opening = true; Save.persist(); go('title'); }
  return {
    enter(arg) {
      AU.bgm(arg && arg.ending ? 'clear' : 'opening');
      const lines = t(arg && arg.ending ? 'ed_lines' : 'op_lines').split('\n');
      $('op-lines').innerHTML = lines.map((l, i) => `<div class="ln ${i === 0 ? 'sys' : ''}">${esc(l)}</div>`).join('');
      const els = $('op-lines').querySelectorAll('.ln');
      const gap = arg && arg.ending ? 2600 : 2300;
      els.forEach((el, i) => timers.push(setTimeout(() => el.classList.add('show'), 600 + i * gap)));
      timers.push(setTimeout(done, 600 + els.length * gap + 3200));
      $('op-skip').onclick = () => { AU.se('click', 0.6); done(); };
    },
    leave() { timers.forEach(clearTimeout); timers = []; },
  };
})();

// ===== 静的テキストの適用・起動 =====
function applyStaticText() {
  document.documentElement.lang = Save.data.lang === 'en' ? 'en' : 'ja';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  if (Screens[curScreen] && Screens[curScreen].refresh) Screens[curScreen].refresh();
}
function boot() {
  Save.load();
  if (!Save.data.lang) Save.data.lang = (navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  applyStaticText();
  fitApp();
  window.addEventListener('resize', fitApp);
  window.addEventListener('orientationchange', () => setTimeout(fitApp, 120));
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { AU.se('click', 0.6); go(b.dataset.go); }));
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Save.persist(true); AU.suspend(); } else AU.resume(); });
  window.addEventListener('pagehide', () => Save.persist(true));
  document.addEventListener('pointerdown', () => AU.kick(), true);
  const imgs = loadImages();
  $('scr-boot').addEventListener('click', () => {
    AU.unlock(); AU.se('click', 0.6);
    imgs.then(() => go(Save.data.opening ? 'title' : 'opening'));
  }, { once: true });
  window.addEventListener('keydown', e => { if (curScreen === 'boot' && (e.key === 'Enter' || e.key === ' ')) $('scr-boot').click(); });
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
