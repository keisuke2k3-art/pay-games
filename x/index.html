  開くとすぐトップへ移動し、「X のポストから来た」と Google アナリティクスに記録される。
  ?to=作品のフォルダ名 を付けると、その作品ページへ(例:…/pay-games/x?to=the-silent-press)

<title>PAY games — 水の中から、ゲームが浮かんでくる。</title>

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@ART_HELPS_YOU">
<link rel="canonical" href="https://keisuke2k3-art.github.io/pay-games/">
<script>
  (function () {
    var q = new URLSearchParams(location.search), to = (q.get("to") || "").replace(/[^a-z0-9-]/g, "");
    var path = to ? "games/" + to + "/" : "", base = location.pathname.replace(/x\/?(index\.html)?$/, "");
    location.replace(base + path + "?utm_source=x&utm_medium=post" + (q.get("c") ? "&utm_campaign=" + encodeURIComponent(q.get("c")) : ""));
  })();
</script>
<meta http-equiv="refresh" content="1; url=../?utm_source=x&amp;utm_medium=post">
</head>
